# Owner: A (render A). Lumen modules written by A for R's gi.lumen final gather (user decision 2026-10-01: the lighting is
# rebuilt on Unreal's structure). Values are Unreal's defaults (r.Lumen.*); (Q) marks the ones that trade accuracy.
[lumen]
# Short-range AO and bent normal (Passes/GI/LumenShortRangeAO.hlsli): the occlusion nearer than the screen probes resolve,
# from the depth buffer. false (default): not computed; the final gather then applies no short-range occlusion.
short_range_ao = true
short_range_ao_downsample = 2                # ShortRangeAO.DownsampleFactor (1 or 2)
short_range_ao_slices = 2                    # (Q) HorizonSearch.SliceCount
short_range_ao_steps = 3                     # (Q) HorizonSearch.StepsPerSlice
short_range_ao_radius_px = 32.0              # 2 x the screen probe spacing (ScreenProbeDownsampleFactor 16 x 2)
short_range_ao_hzb = true                    # HorizonSearch.HZB: samples from the depth pyramid's half-resolution level
short_range_ao_foreground_fraction = 0.3     # HorizonSearch.ForegroundSampleRejectDistanceFraction
short_range_ao_foreground_power = 1.0        # HorizonSearch.ForegroundSampleRejectPower
short_range_ao_temporal = true               # ShortRangeAO.Temporal
short_range_ao_clamp_scale = 1.0             # ShortRangeAO.Temporal.NeighborhoodClampScale
short_range_ao_max_frames = 10.0             # (Q) the gather's Temporal.MaxFramesAccumulated
short_range_ao_history_distance = 0.01       # the gather's Temporal.DistanceThreshold (relative view depth)
short_range_ao_max_multibounce_albedo = 0.5  # ShortRangeAO.MaxMultibounceAlbedo (the integration's lumenAoMultibounce)
short_range_ao_foliage_strength = 0.7        # ShortRangeAO.FoliageOcclusionStrength (the integration's, Foliage pixels)

# Far-field radiance cache (Passes/GI/LumenRadianceCache.hlsli): world-space probes on clipmaps around the camera that the
# screen probes' rays end in (a ray is traced only up to the cache's coverage distance at its probe; a miss reads the
# cache in the ray's direction). false (default): not built; the screen probes' rays run to their full length.
radiance_cache = true
radiance_cache_fold_passes = true                 # the cache's small bookkeeping dispatches share passes (PassChain.h): reset +
                                                  # clear + mark, and reuse + allocate + select + traces - the same dispatches in
                                                  # order, a barrier between them. false: a pass each (A/B)
radiance_cache_clipmaps = 4                       # RadianceCache.NumClipmaps (the gather's); at most 6
radiance_cache_extent_m = 25.0                    # ClipmapWorldExtent (2500 cm): level 0 spans +- this around the camera
radiance_cache_distribution_base = 2.0            # ClipmapDistributionBase: each level's extent is this x the last
radiance_cache_grid = 48                          # (Q) ProbeGridResolution: probes per axis and level
radiance_cache_probe_resolution = 32              # (Q) ProbeResolution: directions per probe = this^2 (stored + 1 border)
radiance_cache_atlas_probes = 128                 # ProbeAtlasResolutionInProbes: at most this^2 probes alive
radiance_cache_probes_per_frame = 100             # (Q) NumProbesToTraceBudget: full-resolution probe updates per frame
radiance_cache_keep_frames = 8                    # NumFramesToKeepCachedProbes: an unused probe keeps its slot this long
radiance_cache_reprojection_radius_scale = 1.5    # ReprojectionRadiusScale: the parallax sphere, in probe TMin radii
radiance_cache_downsample_distance_m = 40.0       # (Q) DownsampleDistanceFromCamera: farther probes trace 1/4 of the rays
radiance_cache_trace_distance_m = 200.0           # Lumen's MaxTraceDistance (20000 cm)
radiance_cache_far_field = true                   # the probes' and the translucency volume's rays run on to the far-field distance
                                                  # (the reference's LumenScene.FarField, there a TLAS of HLODs; here the one ray scene):
                                                  # distant terrain occludes the sky and returns the sun; a hit past the mesh cards takes the
                                                  # sky's light in place of stored bounces. false: the sky beyond the trace distance
radiance_cache_far_field_distance_m = 10000.0     # LumenScene.FarField.MaxTraceDistance (1e6 cm)
radiance_cache_probe_occlusion = true             # ours (LumenRadianceCache.hlsli): a probe's ray is dropped when the probe's line to its start is
                                                  # blocked, and a lookup uses only probes that see the asking ray - no light through walls
radiance_cache_filter = true                      # RadianceCache.SpatialFilterProbes
radiance_cache_filter_max_hit_angle = 0.2         # SpatialFilterMaxRadianceHitAngle (rad)
radiance_cache_mark_tile_px = 16                  # the module's own screen marker: one surface point per tile (the screen
                                                  # probes' spacing); the gather marks its probes itself
radiance_cache_trace_capacity = 1024              # structural bound of probes traced in one frame (new probes are always
                                                  # traced, past the budget at 1/4 of the rays; past this bound they wait a frame)

# Skylight leaking (the reference's post-process settings LumenSkylightLeaking, its tint and LumenFullSkylightLeakingDistance;
# LumenHitIndirect.hlsli lhiSkyLeaking): a share of the sky's light added at the hits of the screen probes', the
# translucency volume's and the reflections' rays whatever stands between the hit and the sky - an artist's control for
# interiors the bounces leave too dark. It is a leak by construction: with a value above 0 a closed room is brighter by
# day than by night. 0 (the reference's default too) = none.
skylight_leaking = 0.0
skylight_leaking_tint = [1.0, 1.0, 1.0]
skylight_leaking_full_distance_m = 10.0           # a hit this far along its ray takes the whole share, nearer hits in proportion (1000 cm)
skylight_leaking_reflection_average_albedo = 0.25 # r.Lumen.SkylightLeaking.ReflectionAverageAlbedo: the reflections' hits take the
                                                  # share as light returned by a surface of this albedo

# Indirect light at ray hits that have no mesh card (Passes/GI/LumenHitIndirect.hlsli) - deforming instances (skin, wind)
# and faces no card of their mesh sees. NOT in the reference: its hit without a valid surface-cache sample is black
# (a skinned character in a mirror shows only what the lights reach directly). true: such a hit takes the irradiance of
# the translucency volume where it lies in a lit cell of the view's grid, else that of the radiance cache's probes.
hit_indirect = true
hit_indirect_radiance_cache = true                # the radiance cache keeps an irradiance map per probe (the reference's
                                                  # CalculateIrradiance: 6 x 6 normals, + 1 border) for the hits the volume
                                                  # does not answer - behind the camera, behind what the view sees; such hits
                                                  # ask for probes where they fall. false: the volume alone
hit_indirect_mark_clipmap_bias = 2                # ... at a clipmap this many levels coarser than the hit's own (the hits
                                                  # fall wherever a ray reaches: at the surfaces' probe density they would
                                                  # take the cache's budget)

# The final gather's pixel history (Passes/GI/Lumen/LgTemporal.hlsl), beside gi.lumen_temporal_*:
gather_temporal_distance_threshold_foliage = 0.03 # ScreenProbeGather.Temporal.DistanceThresholdForFoliage: a foliage pixel (a
                                                  # Foliage or Subsurface material) keeps a history pixel within this
                                                  # relative plane distance (other pixels: gi.lumen_temporal_distance_threshold
                                                  # 0.01) - foliage is full of edges, and losing its history there flickers
gather_temporal_reject_normal = false             # ScreenProbeGather.Temporal.RejectBasedOnNormal (reference: 0): a history
                                                  # pixel whose normal is further than the threshold below from the pixel's
                                                  # is not taken - less streaking where surfaces meet (a character's feet)
gather_temporal_normal_threshold_deg = 45.0       # ScreenProbeGather.Temporal.NormalThreshold

# Translucency volume (Passes/GI/LumenTranslucencyVolume.hlsli): indirect light for what is not an opaque surface of the
# view - air and fog, particles, water, glass - on a view-aligned grid (cells 32 px wide, 26 exponential slices to 80 m),
# 3 x 3 rays a cell that end in the radiance cache. false (default): not built; those readers get no indirect light from it.
translucency_volume = true
translucency_volume_end_distance_m = 80.0         # EndDistanceFromCamera (8000 cm)
translucency_volume_grid_reference_height = 720   # the cells are 32 pixels (GridPixelSize) for views up to 1.4 x this height; a higher view
                                                  # gets the power of two nearest the same angle (1080 internal: 64 px) - the volume holds
                                                  # low-order light per direction and depth, not per pixel. 0: 32 px everywhere
translucency_volume_depth_offset_threshold = 64.0 # slices: a cell's sample behind its pixel's surface is moved in front of it while the move
                                                  # is under this (reference 1: samples past a wall stay there and bring the other side's light)
translucency_volume_spatial_filter = true         # SpatialFilter
translucency_volume_filter_samples = 3            # SpatialFilter.SampleCount: cells either side, per axis
translucency_volume_filter_deviation = 5.0        # SpatialFilter.StandardDeviation (cells): close to a box
translucency_volume_temporal = true               # TemporalReprojection
translucency_volume_history_weight = 0.9          # (Q) Temporal.HistoryWeight: the history's share of a cell each frame
translucency_volume_jitter = true                 # Temporal.Jitter: the cells' sample points move inside the cell per frame
translucency_volume_max_ray_intensity = 20.0      # (Q) MaxRayIntensity: a ray's exposed radiance is held to this; 0 = no cap
translucency_volume_clipmap_bias = 3              # ShareRadianceCacheWithOpaque.ClipmapBias: the volume's cells use radiance
                                                  # cache probes this many levels coarser than the opaque gather's
