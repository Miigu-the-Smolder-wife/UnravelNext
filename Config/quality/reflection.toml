# Owner: R. ARCHITECTURE 2.6.
[reflection]
batch_gi_corners = false # A/B only until register/occupancy and deterministic bit checks pass
cache_lobe_half_angle_min_deg = 22.0   # K path when the (narrowed) lobe is at least this wide
g_rays_per_sample = 4
g_sample_spacing_px = [1, 16]
mirror_roughness_max = 0.14
exact_set_min_hits = 64
planar_max_wave_slope_deg = 2.0
planar_views_max = 4                   # reflection cameras per frame (largest pixel counts); others use rays
planar_view_fixed_ms = 0.05             # prior cost of a planar reflection view: a + b x its mirror pixels (b per pixel, ns; the view draws only them, planarMask);
planar_view_ns_per_px = 0.34            # replaced online by the view's own measured cost. Design 2.6: 2.14 ms per 8.3 M px (0.26)
planar_ray_ns = 1.0                    # prior cost per traced reflection ray (ns) for the view / ray choice under debug.deterministic, which
                                       # uses the priors alone (measured times differ between runs) [expected: r.refl ~2 ms / ~2 M rays]
                                       # + S's per-view products (froxel lists, air from the mirror, local-light shadow
                                       # slots; S request 20260925_S_planar_view_products) 0.08 [expected]
temporal_history_max = 32             # time integration (ReflectionAccumulate, design 2.6): running mean over at most this many
                                       # frames where identity, motion and revision are proven (as the GI cache's window)
temporal_lobe_shift = 0.1              # the history window is limited so the reflected direction travels at most this share of the
                                       # lobe half-angle over it (view-dependence of the lobe integral; mirrors: still views only),
                                       # and the reflected hits move at most this share of the ray footprint there
hit_cone_lobes = true                  # the hits' specular lobes toward their lights widened by the ray cone (base lobe for the
                                       # local-light sample, coat lobe for local lights and the sun; ReflectionShade.hlsli), as GI
                                       # hits do: a reflection value is a mean over its cone. false = the lobes at the single ray
                                       # direction (the path before 2026-10-01: rare huge highlight samples on glazed and glossy
                                       # hits). A/B
# Redesign V2 P2 (RENDERER_REDESIGN_V2 1.2, reconstruction A; Native/Render/Passes/Reconstruct). The previous path
# (the value integrated over temporal_history_max frames by ReflectionAccumulate) stays behind layers = false for A/B.
layers = false                         # the values as base + residual + albedo x stochastic (ReflectionInternal.hlsli): the hits'
                                       # stochastic light (cache light, one-sample local lights) over the hits' albedo and the G
                                       # lobe residual as layers, composed back by LayerCompose (the same value when unfiltered)
layer_filter = true                    # the layers' spatial reconstruction every frame (LayerDenoise: three a-trous levels guided
                                       # by the hit geometry for M, the receiver and the lobe footprint for G); the mirror
                                       # image's identity (base) passes no filter
layer_history_frames = 8               # the layers' running mean (LayerTemporal) in place of temporal_history_max's 32: the
                                       # spatial reconstruction is the frame's value, the history removes what it leaves
                                       # (design 10.5: 32 without the spatial filter against 8 with it). 1 = no history
layer_residual_whole = true            # a G pixel's residual layer is its lobe estimate minus the stochastic share (true), or that
                                       # minus the control variate's lobe integral gbar, which then stays unfiltered per pixel
                                       # (false: design 1.2's L_g). Not settled by measurement (ReflectionInternal.hlsli): A/B
layer_mirror_lobe = false              # DECISION ITEM, off: an M pixel's value without its stochastic share (its "identity") is also
                                       # a layer, reconstructed inside its lobe's footprint (Gaussian sigma blur_px / 2 over
                                       # receiver-guided taps, as G's residual). Design 1.2 keeps M's identity out of every
                                       # spatial filter - right for a mirror (blur_px < 1: the Gaussian leaves it untouched),
                                       # but M is every roughness below mirror_roughness_max, whose one ray per pixel is one
                                       # draw of a GGX lobe up to ~4 deg wide: a footprint of tens of pixels, one sample each
                                       # frame, integrated by the previous path only while the view stands still
layer_history_bound = true             # the history is brought within the reconstructed layer's 3 x 3 neighbourhood (mean +- 3
                                       # deviations + 5 %) before it is mixed. A/B, not settled by measurement: false = no
                                       # bound (a lighting change then takes layer_history_frames frames to arrive in the
                                       # layers); the bound may be too tight where the reconstruction leaves low-frequency
                                       # noise (it then removes the history that would average it) [expected, to measure]
layer_view = 0                         # diagnostics, written to view.reflection instead of the value (LayerCompose.hlsl):
                                       # 1 stochastic, 2 reconstructed, 3 |residual|, 4 reconstructed, 5 albedo, 6 base, 7 alphas
stats_log_frames = 0                   # diagnostics: every N frames the log gets the reflection hits' cache lookups and
                                       # misses and the G samples' estimator branch and mean L / mean g histogram (0 = off)
experiment_disable = 0                 # cost attribution only (recorded in the quality hash): 1 = sun shadow rays at hits without
                                       # any-hit, 2 = no sun visibility at hits (neither VSM nor rays), 4 = sun visibility at hits
                                       # by shadow rays only (no VSM lookup), 8 = hit materials without textures, 16 = no cache
                                       # lookup at hits, 32 = traversal only (a hit returns 1), 64 = every job traced and shaded
                                       # in the ray generation shader (no compute split), 128 = G jobs by the difference estimator alone
                                       # (reflLobeEstimate), 256 = reflection hits read the GI cache only (no cells created,
                                       # touched or requested), 512 = no time integration (each frame's own estimate),
                                       # 1024 = the time integration's state instead of the value (diagnostics). Never nonzero
                                       # outside measurements.
