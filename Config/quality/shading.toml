# Owner: M (M session, INTERFACES v1.2). ARCHITECTURE 2.4, 2.10, 2.11.
[shading]
tonemap = "pbr_neutral"           # Khronos PBR Neutral (INTERFACES 8.4)
output_encoding = "srgb"          # RGB10A2 display output
analytic_lights_max = 16          # per froxel list beyond which the rest merge into froxel irradiance (error logged)
# Edge (E) pixels and surface groups (Passes/Shading/Edge.hlsli): two pixels are one surface when the material matches,
# the shading normals differ by less than the angle, and each lies within max(footprint x ft, distance x dt) of the
# other's tangent plane. ARCHITECTURE 2.10: up to three surfaces per edge pixel.
edge_normal_angle_deg = 30.0
edge_footprint_tolerance = 1.5
edge_distance_tolerance = 0.3
edge_groups_max = 3
# Screen bands of M's own group of edge detection and shading kernels (INTERFACES v1.29), used until the frame assembles
# S's visibility and M's passes into one group: 1 = one band over the view, 0 = the frame's passBandCount
# (output.band_pixels). One band: at city 4K 8 bands measured detection +0.055 ms and shading -0.006 ms (the shading
# kernel is latency-bound at 1.33 ms, far above its 0.2-0.25 ms DRAM floor, so L2 hits barely help while 8x more
# dispatches and barriers cost). The class tile lists are split by the frame's bands either way (exact).
pass_bands = 1
# Cost attribution only (gate --set): bit mask of shading terms left out, 0 in every gate and image. 1 = sun disk
# regimes below point evaluation (point instead), 2 = GI probe irradiance, 4 = reflection / K-path radiance,
# 8 = S's air volume lookup (aerial perspective, air shadows, local lights' air; sun illuminance then unattenuated),
# 16 = sun, 32 = local lights, 64 = edge composite with one triangle per surface group, 128 = edge composite without
# coverage geometry, 256 = no edge detection (no edge pixels), 512 = edge composite without subsample masks, 1024 = edge
# composite without cut-out coverage, 2048 = no shadow visibility reads (slots lit), 4096 = no tone map (raw value).
experiment_disable = 0
