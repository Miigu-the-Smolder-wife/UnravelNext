# Owner: M (M session, INTERFACES v1.2). ARCHITECTURE 2.4, 2.10, 2.11.
[shading]
tonemap = "pbr_neutral"           # Khronos PBR Neutral (INTERFACES 8.4)
emissive_area_lights = false      # 14.1b (L2b): constant-emission surfaces of non-skinned instances become quadtree area lights
                                  # for the diffuse direct light (first frame exact, no cache cold start); no shadows yet (14.3)
                                  # and R/S2's double-counting rule pending, so off by default
emissive_leaf_m = 0.1             # 14.1b: the quadtree's largest leaf square (m); nodes are evaluated when diagonal <= 0.8 x distance
coverage_tile_lights = false      # 14.1c (L2c): coverage records' direct light from a per-tile depth-interval x direction-bin FAR field
                                  # (Passes/Lights/CoverageTileLights.hlsl); NEAR, shadowed and horizon-straddling lights stay per record.
                                  # Gate: ShadingTests coverage |dE|/E P99 <= 1e-3, m.coverage* lounge <= 0.1 ms
coverage_tile_lights_capacity = 4096  # listed coverage tiles the field holds (6176 B each); tiles past it keep the per-record loop (exact)
tile_lights = false               # 14.1/14.2 (L2): per 8x8 tile NEAR/FAR classification of the froxel lists (Passes/Lights/TileLights.hlsl);
                                  # FAR lights' diffuse comes from the tile corners' vector irradiance (1e-3 rule), their specular stays
                                  # per pixel (D-23 pending); every shadow caster is NEAR until 14.3. Gate: tile vs per-pixel |dE|/E P99 <= 1e-3
output_encoding = "srgb"          # RGB10A2 display output
# Edge (E) pixels and surface groups (Passes/Shading/Edge.hlsli): two pixels are one surface when the material matches,
# the shading normals differ by less than the angle, and each lies within max(footprint x ft, distance x dt) of the
# other's tangent plane. ARCHITECTURE 2.10: up to three surfaces per edge pixel.
edge_normal_angle_deg = 30.0
edge_footprint_tolerance = 1.5
edge_distance_tolerance = 0.3
edge_groups_max = 3
# Cost attribution only (gate --set): bit mask of shading terms left out, 0 in every gate and image. 1 = sun disk
# regimes below point evaluation (point instead), 2 = GI probe irradiance, 4 = reflection / K-path radiance,
# 8 = S's air volume lookup (aerial perspective, air shadows, local lights' air; sun illuminance then unattenuated),
# 16 = sun, 32 = local lights, 64 = edge composite with one triangle per surface group, 128 = edge composite without
# coverage geometry, 256 = no edge detection (no edge pixels), 512 = edge composite without subsample masks, 1024 = edge
# composite without cut-out coverage, 2048 = no shadow visibility reads (slots lit), 4096 = no tone map (raw value),
# 8192 = coverage composite in a frame with S's shadows but without S's fragment visibility (its fragments unshadowed).
experiment_disable = 0
# Automatic exposure (FEATURES_GAME 6.2, A4; Exposure.cpp), for cameras without an EV100: the metered log-mean luminance
# between the darkest and brightest cut fractions of the centre-weighted histogram maps onto the target grey; the EV
# follows it with exact exponential adaptation (seconds to 63 %), snapping after cuts and restores.
exposure_min_ev = -6.0
exposure_max_ev = 22.0
exposure_target_grey = 0.18
exposure_adapt_brighter_seconds = 0.6
exposure_adapt_darker_seconds = 2.5
exposure_cut_dark = 0.10
exposure_cut_bright = 0.02
exposure_centre_sigma = 0.8
# HDR post chain (FEATURES_GAME 4, 6; A4; Post.cpp): off by default (gates and reference images compare the curve's
# input); a game turns terms on by quality override. bloom: the energy fraction the lens PSF scatters into its tail
# (0 = off; the kernel sums to 1) over bloom_levels octaves; vignette: 0..1 blend of natural cos^4 vignetting; grain:
# relative standard deviation (< 0.4) of the deterministic luminance grain after the curve, multiplicative in linear
# light (zero-mean, black stays black); lut: a 3D .cube grading LUT.
post_bloom_strength = 0.0
post_bloom_levels = 6
post_vignette = 0.0
post_grain = 0.0
post_lut = ""
# Display rendering (U2): "film" (default; ShadingCommon.hlsli shFilm: filmic toe and shoulder, highlights roll off to
# white, scene grey 0.18 stays 0.18) or "neutral" (Khronos PBR Neutral: base colours kept, flatter).
post_tone_curve = "film"

# Motion blur (A5; COVERAGE 14.12 (2); MotionBlur.cpp): the shutter's open time as a fraction of the frame interval,
# the exposure [t - s dt, t]; 0.5 = 180 degrees (the user's gate camera, 2026-09-26), 0 = instantaneous. Frames without
# motion (static camera and scene) are unchanged.
motion_blur_shutter = 0.5
