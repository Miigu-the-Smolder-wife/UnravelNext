# Owner: M (M session, INTERFACES v1.2). ARCHITECTURE 2.4, 2.10, 2.11.
[shading]
tonemap = "pbr_neutral"           # Khronos PBR Neutral (INTERFACES 8.4)
emissive_area_lights = false      # 14.1b (L2b): constant-emission surfaces of non-skinned instances become quadtree area lights
                                  # for the diffuse direct light (first frame exact, no cache cold start); no shadows yet (14.3)
                                  # and R/S2's double-counting rule pending, so off by default
emissive_leaf_m = 0.1             # 14.1b: the quadtree's largest leaf square (m); nodes are evaluated when diagonal <= 0.8 x distance
coverage_tile_lights = false      # 14.1c (L2c): coverage records' direct light from a per-tile depth-interval x direction-bin FAR field
                                  # (Passes/Lights/CoverageTileLights.hlsl); NEAR, shadowed and horizon-straddling lights stay per record.
                                  # Gate: ShadingTests coverage |dE|/E P99 <= 1e-3, m.coverage* lounge <= 0.1 ms
coverage_tile_lights_capacity = 4096  # listed coverage tiles the field holds (6176 B each); tiles past it keep the per-record loop (exact)
coverage_compact = true           # the coverage composite's light pixels (<= 16 records) in the compact form (CoverageShade.hlsli;
                                  # written 2026-10-03, built, not run): CoverageWalk weights each pixel's records nearer first
                                  # and lists those with weight per tile, the list is shaded one record per lane, 64 at a time -
                                  # in one kernel (CoverageShadeWhole: the surface, material and air once per record) unless
                                  # the records run the area lights' loop (then CoverageShadeList's two parts, the DXIL limit) -
                                  # and CoverageGather sums each pixel's entries over band A.
                                  # false: CoverageComposite shades inside each pixel lane's own loop - a wave then runs the
                                  # shading as often as its deepest pixel has visible records, the other lanes idle (A/B).
                                  # The same weights and shading calls; the per-pixel sum stays in float (the composite keeps
                                  # its direct part in half floats between its two kernels): the picture differs by that
                                  # rounding. 20 B of transient buffers per record of V's pool
tile_lights = false               # 14.1/14.2 (L2): per 8x8 tile NEAR/FAR classification of the froxel lists (Passes/Lights/TileLights.hlsl);
                                  # FAR lights' diffuse comes from the tile corners' vector irradiance (1e-3 rule), their specular stays
                                  # per pixel (D-23 pending); every shadow caster is NEAR until 14.3. Gate: tile vs per-pixel |dE|/E P99 <= 1e-3
output_encoding = "srgb"          # RGB10A2 display output
# Stochastic direct light of the local lights (Passes/Shading/MegaLights.hlsli; user decision 2026-10-01: the lighting is
# rebuilt on Unreal Engine's structure; owner A). true: every listed light is a candidate with its shadow (no slot limit),
# the main view's kernels take N light samples per downsampled pixel with one shadow ray each (R's ray scene), then a
# temporal and a spatial filter; false: the per-pixel loop with S's shadow slots (128 lights at most cast shadows). The values below are Unreal's defaults (r.MegaLights.*, centimetres turned to metres); the
# ones that trade accuracy for cost or noise are the user's to set (UNREAL_COMPARISON_LIGHTS_KO.md 5):
# samples, downsample, the weight caps, min_sample_weight, the history length and the filter radius.
mega_lights = true                                # default since 2026-10-02 (lobby against the path-traced reference: the ceiling 1.0x with it, 1.4-1.7x
                                                  # without - 699 of the 827 lights shone unshadowed past the 128 slots; GPU frame 13.0 -> 7.1 ms at 1080p)
mega_lights_downsample = 2                        # DownsampleMode: 2 = 2 x 2 (one sample pixel per block and frame), 1 = full
mega_lights_samples = 4                           # NumSamplesPerPixel: 1, 2 or 4 per downsampled pixel
mega_lights_min_sample_weight = 0.001             # MinSampleWeight: exposed luminance under which a light fades out of the sampling
mega_lights_guide_by_history = true               # GuideByHistory: lights hidden in the previous frame's tile weigh less
mega_lights_hidden_weight = 0.1                   # GuideByHistory.LightHiddenWeight
mega_lights_hidden_weight_history_miss = 0.4      # GuideByHistory.LightHiddenWeightForHistoryMiss
mega_lights_merge_rays = true                     # MergeRays: samples of one light share a ray outside penumbrae
mega_lights_max_shading_weight = 20.0             # MaxShadingWeight: cap of a sample's 1 / probability (energy lost above it)
mega_lights_max_shading_weight_hidden = 5.0       # MaxShadingWeightForHiddenLight
mega_lights_screen_traces = true                  # ScreenTraces: a sample's ray is walked across the depth buffer first (contact shadows, and
                                                  # shadows of what the ray scene does not hold as drawn); a hit hides the sample
mega_lights_screen_trace_max_iterations = 50      # ScreenTraces.MaxIterations
mega_lights_screen_trace_max_distance_m = 1.0     # ScreenTraces.MaxDistance (100 cm)
mega_lights_screen_trace_relative_thickness = 0.005  # ScreenTraces.RelativeDepthThickness
mega_lights_screen_trace_normal_bias_m = 0.0005   # ScreenTraces.NormalBias (0.05 cm), on top of the pixel's footprint on the normal x 2
mega_lights_ray_bias_m = 0.01                     # HardwareRayTracing.Bias (TMin)
mega_lights_ray_normal_bias_m = 0.001             # HardwareRayTracing.NormalBias
mega_lights_ray_end_bias_m = 0.01                 # HardwareRayTracing.EndBias (1 cm): where a shadow ray ends before its point on the
                                                  # light, for lights without their own value (scene::Light::rayEndBias, v1.93: a light in
                                                  # a housing or a trough takes a larger one, as Unreal's per-light Ray End Bias)
mega_lights_temporal = true                       # Temporal
mega_lights_temporal_max_frames = 12              # Temporal.MaxFramesAccumulated
mega_lights_temporal_min_frames_history_miss = 4  # Temporal.MinFramesAccumulatedForHistoryMiss
mega_lights_temporal_distance_threshold = 0.03    # Temporal.HistoryDistanceThreshold (relative view depth)
mega_lights_temporal_clamp_scale = 1.0            # Temporal.NeighborhoodClampScale (standard deviations)
mega_lights_spatial = true                        # Spatial
mega_lights_spatial_radius_px = 8.0               # Spatial.KernelRadius
mega_lights_spatial_samples = 4                   # Spatial.NumSamples (twice after a disocclusion)
mega_lights_spatial_depth_weight = 10000.0        # Spatial.DepthWeightScale
mega_lights_spatial_max_disocclusion_frames = 2   # Spatial.MaxDisocclusionFrames
mega_lights_spatial_disocclusion_scale_diffuse = 2.0   # Spatial.DisocclusionDiffuseSpatialVarianceScale
mega_lights_spatial_disocclusion_scale_specular = 1.0  # Spatial.DisocclusionSpecularSpatialVarianceScale
mega_lights_spatial_history_variance = true       # Spatial.UseHistorySpatialVariance
mega_lights_spatial_history_stddev = 0.15         # Spatial.HistorySpatialStdDevThreshold
# The air (Passes/Atmosphere/MegaLightsVolume.hlsl; with mega_lights): the local lights' in-scattering per froxel from light
# samples with shadow rays, in place of the integration's loop over the list and the shadow-map walks of slotted lights.
mega_lights_volume = true                         # Volume
mega_lights_volume_samples = 2                    # Volume.NumSamplesPerVoxel
mega_lights_volume_min_sample_weight = 0.1        # Volume.MinSampleWeight
mega_lights_volume_max_frames = 10                # the air's history length (Unreal: the fog's r.VolumetricFog.HistoryWeight 0.9)
# Subsurface class, stage B: screen-space subsurface scattering (Passes/Shading/SubsurfaceScatter.hlsli; the structure of
# Unreal's Burley subsurface pass). In scenes with Subsurface materials the class's diffuse light is kept apart per unit
# albedo, scattered along the surface with Burley's normalized diffusion profile at the material's mean free path per
# colour channel, and multiplied by the albedo after it. Scenes without such materials record no pass.
subsurface_scatter = true                         # false: stage A's picture (the class's diffuse light stays at its pixel)
subsurface_scatter_samples = 16                   # samples per pixel and frame, even, 2..64 (pairs across the pixel; Unreal: 8 to 64 by variance);
                                                  # the temporal upscale accumulates the frames' patterns
subsurface_scatter_min_px = 1.0                   # mean scatter radius (2.5 d of the widest channel) in pixels under which a pixel keeps its own
                                                  # diffuse light and takes no sample; full strength from twice this
# Eyes (Subsurface materials with an iris, scene::Material::eyeIrisRadius; MaterialModel.h "Eye", Passes/Material/
# MaterialEye.hlsli): the resolve finds the iris point seen through the cornea (refraction onto the iris plane, the
# pupil's scale, the limbal ring) and the class's kernels light the iris on its own plane with the caustic.
eye_model = true                                  # false: an eye's pixels are the plain Subsurface model with the base colour at the surface's
                                                  # own uv - the eye as ray hits and coverage fragments always show it
# Strand hair records (Passes/Shading/CoverageHair.hlsl, with visibility.coverage_hair): the hair between a strand and a
# light comes from E's density volume (Passes/Hair/HairDensity.hlsli).
hair_density_resolution = 64      # cells along the longest side of a body's box (a multiple of 4, at most 128; 0: no volume -
                                  # every strand is then shaded with no fibre in front and hair_fibres_behind behind)
hair_density_bodies = 16          # the nearest bodies that get a block of the volume (resolution^3 x 6 B each); the others
                                  # are shaded as with resolution 0
hair_density_steps = 16           # samples of a strand's march through the volume towards a light (the indirect light's
                                  # four marches take half as many). A path longer than 1.5 cells a sample reads its first
                                  # steps / 2 cells one by one - the hair next to the strand at the cells' size, which
                                  # draws the edge of the hair's shadow on itself - and the rest in the cells' 4 x 4 x 4
                                  # means, one coarse cell a sample (at most this many: 8 + 16 x 4 = 72 cells at 16)
hair_march_jitter = true          # every march through the volume (the strands', hair_shadows') takes its samples at a
                                  # phase drawn per pixel / record / segment point and frame, so the cells' pattern along
                                  # a shadow's edge becomes noise the temporal filters remove (Unreal's hair voxel
                                  # traversal does the same); false: the midpoint rule, the same every frame
hair_lights_spatial = false       # with mega_lights: the spatial filter on the hair records' local lights (Unreal runs its hair
                                  # input without one: "no proper reconstruction filter"); the temporal filter always runs
hair_fibres_behind = 2.0          # fibres taken to lie behind a strand whose body has no block (the neighbourhood's backward
                                  # lobe counts with 1 - exp(-this))
hair_shadows = true               # the hair's shadow on what is not hair (Passes/Hair/HairShadow.hlsl): the sun slot of S's
                                  # screen visibility and, with mega_lights, the local lights' samples are multiplied by what
                                  # the grooms on the path to the light let through (exp(-fibres) from the density volume).
                                  # And a body's shadow on another body's strands: a strand counts the other bodies' fibres
                                  # between it and a light with its own (a beard under the head's hair, the next head).
                                  # The same transmittance reaches: the coverage layer's cluster fragments under the sun
                                  # (4 depths per pixel with records, HairShadow MODE 2), the fog's cells and the air's
                                  # slices under the sun, and - without mega_lights - S's local slots 1..3 of the opaque
                                  # surfaces. The shadow is as fine as the volume's cells (about 1 cm on a head), of the
                                  # bodies with a block (hair_density_bodies; the nearest 64 at most). Not shadowed: the
                                  # fog's and the air's local lights, the coverage layer's fragments under local lights
                                  # without mega_lights, a local light past the pixel's third shadow caster.
                                  # Frames without a density volume record no pass.
hair_shadow_steps = 32            # that march's steps through a body at most (2..128). A step is one coarse cell (4 cells):
                                  # empty ones are skipped, the others read in 4 samples of the cells, so the shadow has
                                  # the cells' size wherever the path is. A path of more coarse cells than this (resolution
                                  # 128: up to 56) reads the cells' means alone
hair_lights_ray_depths = true     # with mega_lights: the shadow rays of the hair records' light samples start where the pixel's
                                  # ray first meets the groom in the density volume (a quantile per frame; the temporal filter
                                  # keeps the mean), not at the pixel's nearest record - an opaque caster's shadow edge then
                                  # falls at the same place on every strand, however few and wide the LOD draws them
hair_segment_shading = true       # the strand's part of the sun's and the indirect light once per segment that has a record
                                  # (three points along it, a record takes the two around it) instead of once per record
                                  # (48 B of transient memory per segment of the frame, 8 B per record of V's pool for the
                                  # list of the records in front of the opaque surface: each with its tile, found once per
                                  # block of 1,024 records instead of by a search per record)
# Edge (E) pixels and surface groups (Passes/Shading/Edge.hlsli): two pixels are one surface when the material matches,
# the shading normals differ by less than the angle, and each lies within max(footprint x ft, distance x dt) of the
# other's tangent plane. ARCHITECTURE 2.10: up to three surfaces per edge pixel.
edge_normal_angle_deg = 30.0
edge_footprint_tolerance = 1.5
edge_distance_tolerance = 0.3
edge_groups_max = 3
# Cost attribution only (gate --set): bit mask of shading terms left out, 0 in every gate and image. 1 = sun disk
# regimes below point evaluation (point instead), 2 = GI probe irradiance, 4 = reflection / K-path radiance,
# 8 = S's air volume lookup (aerial perspective, air shadows, local lights' air; sun illuminance then unattenuated),
# 16 = sun, 32 = local lights, 64 = edge composite with one triangle per surface group, 128 = edge composite without
# coverage geometry, 256 = no edge detection (no edge pixels), 512 = edge composite without subsample masks, 1024 = edge
# composite without cut-out coverage, 2048 = no shadow visibility reads (slots lit), 4096 = no tone map (raw value),
# 8192 = coverage composite in a frame with S's shadows but without S's fragment visibility (its fragments unshadowed).
# 16384 = shadow-casting local lights without a VSM slot (the 128-slot limit) add no direct light in the main shading kernel
# (their share; L3 stage 5 removes the limit).
experiment_disable = 0
# Automatic exposure (FEATURES_GAME 6.2, A4; Exposure.cpp), for cameras without an EV100: the metered log-mean luminance
# between the darkest and brightest cut fractions of the centre-weighted histogram maps onto the target grey; the EV
# follows it with exact exponential adaptation (seconds to 63 %), snapping after cuts and restores.
exposure_min_ev = -6.0
exposure_max_ev = 22.0
exposure_target_grey = 0.18
exposure_adapt_brighter_seconds = 0.6
exposure_adapt_darker_seconds = 2.5
exposure_cut_dark = 0.10
exposure_cut_bright = 0.02
exposure_centre_sigma = 0.8
exposure_linear_distance_ev = 0.0      # 0: the EV approaches its target exponentially all the way (the time constants above).
                                       # > 0: farther than this many stops from the target it moves at a constant rate - the
                                       # exponential's rate at that distance - so a large change (a door to daylight) takes its
                                       # time instead of jumping most of the way in the first frames (the reference's linear /
                                       # exponential adaptation, r.EyeAdaptation.ExponentialTransitionDistance 1.5)
# HDR post chain (FEATURES_GAME 4, 6; A4; Post.cpp). bloom: the energy fraction the lens PSF scatters into its tail
# (0 = off; the kernel sums to 1) over bloom_levels octaves - 0.082 is the share Unreal's default bloom adds (intensity
# 0.675 x its six stage tints / 6 = 0.089 of the scene, here taken out of the core instead of added); vignette: cos^4
# vignetting on a circle through the corners, tan(angle) = radius x this (Unreal's VignetteIntensity, default 0.4: the
# corners at 0.57, the edge centres at 0.65 and 0.86 for 16 : 9); grain: relative standard deviation (< 0.4) of the
# deterministic luminance grain after the curve, multiplicative in linear light (zero-mean, black stays black); lut: a
# 3D .cube grading LUT. Reference comparisons that want the curve's input alone set bloom and vignette to 0.
post_bloom_strength = 0.082
post_bloom_levels = 6
post_vignette = 0.4
post_local_exposure = true                         # local exposure, the reference's bilateral method (LocalExposure.hlsli): a window in a dim room
                                                   # stays readable, the room does not go black. One grid pass and two lookups in the final pass
post_local_exposure_highlight_contrast = 0.8       # contrast of regions brighter than middle grey (the reference's project default
                                                   # r.DefaultFeature.LocalExposure.HighlightContrastScale 0.8; 1 = unchanged)
post_local_exposure_shadow_contrast = 0.8          # ... and darker (ShadowContrastScale 0.8)
post_local_exposure_detail_strength = 1.0          # LocalExposureDetailStrength
post_local_exposure_blurred_blend = 0.6            # LocalExposureBlurredLuminanceBlend: share of the blurred luminance in a region's base
post_local_exposure_blurred_kernel_percent = 50.0  # LocalExposureBlurredLuminanceKernelSizePercent (of the view's width, a diameter)
post_local_exposure_middle_grey_bias = 0.0         # LocalExposureMiddleGreyBias (stops)
post_grain = 0.0
post_lut = ""
# The tonemapper's sharpen (PostFinal.hlsl; the reference's r.Tonemapper.Sharpen, off in its defaults): 0 = off, 0.5 half,
# 1 full strength - the pixel less the mean of its four neighbours added back, less next to very bright content.
post_sharpen = 0.0
# Scene colour fringe (the reference's chromatic aberration in the tonemapper, SceneFringeIntensity 0 = off): percent by
# which the image's edge is displaced between the wavelengths - red and green are read nearer the centre than blue;
# post_fringe_start (ChromaticAberrationStartOffset 0): the distance from the centre, 0 .. 1 of the half-size, beyond
# which the fringe grows.
post_fringe = 0.0
post_fringe_start = 0.0
# Image-based lens flares (PostFlare.hlsl; the reference's lens flares, off in its project defaults -
# r.DefaultFeature.LensFlare false): ghosts of the picture's bright parts, each spread to the aperture's shape, added
# to the picture after the bloom. Checked against the reference checkout (PostProcessLensFlares.cpp / .usf): eight
# flares, a flare's scale (its tint's 4th number - 0.5) x 7, the intensity x the bloom's intensity, the threshold on
# r + g + b of the source faded by the disc mask at half scale, the bokeh size in percent of the flare view's width, the
# composite's two disc masks, r.LensFlareQuality 2. From memory - they are FPostProcessSettings' defaults, in the Engine
# module that is not in the checkout: LensFlareIntensity 1, LensFlareTint white, LensFlareBokehSize 3,
# LensFlareThreshold 8, the eight LensFlareTints below, the bloom intensity 0.675, and the default bokeh texture being a
# disc.
post_lens_flare = false
post_lens_flare_intensity = 1.0                 # LensFlareIntensity (x the reference's bloom intensity 0.675)
post_lens_flare_tint = [1.0, 1.0, 1.0]          # LensFlareTint
post_lens_flare_bokeh_size = 3.0                # LensFlareBokehSize: the aperture shape's size, percent of the view's width
post_lens_flare_threshold = 8.0                 # LensFlareThreshold: r + g + b of the exposed scene colour from which a pixel flares
post_lens_flare_blades = 0                      # the shape: 0 a disc, 3 .. 16 a polygon of that many aperture blades (the reference: a
                                                # bokeh texture, a disc by default)
post_lens_flare_halo = 0.0                      # ours (the reference has none): a ring of the mirrored bright parts; 0 = none
post_lens_flare_tint_1 = [1.0, 0.8, 0.4, 0.6]   # LensFlareTints 1 .. 8: each ghost's colour, and in the 4th number its scale about
post_lens_flare_tint_2 = [1.0, 1.0, 0.6, 0.53]  # the picture's centre, (value - 0.5) x 7: 0.7, 0.21, -0.28, -0.77, -1.33, -1.61,
post_lens_flare_tint_3 = [0.8, 0.8, 1.0, 0.46]  # -1.96, -2.45 (negative: mirrored through the centre)
post_lens_flare_tint_4 = [0.5, 1.0, 0.4, 0.39]
post_lens_flare_tint_5 = [0.5, 0.8, 1.0, 0.31]
post_lens_flare_tint_6 = [0.9, 1.0, 0.8, 0.27]
post_lens_flare_tint_7 = [1.0, 0.8, 0.4, 0.22]
post_lens_flare_tint_8 = [0.9, 0.7, 0.7, 0.15]
# Scene-referred colour grading before the tone curve (Post.cpp gradeLut, PostGradeLut.hlsl; the reference's post process
# colour grading and its combined LUT, PostProcessCombineLUTs): with any value off its default the grading and the tone
# curve are baked into one post_grading_lut_size^3 table that the final pass reads once per pixel (rebuilt only when a
# value changes); at the defaults the curve is evaluated per pixel and the picture is unchanged. A game sets the same
# values per frame through FrameContext::grading (enabled: its values replace these).
# Each value is [r, g, b, master]: the master multiplies the three (offset: adds to them). The shadows', midtones' and
# highlights' values combine with the global ones (products; offsets: sums) and weigh in by the pixel's luma (ACEScg).
post_grading_temperature = 6500.0                # WhiteTemp: the scene's white the picture is balanced from, K (6500: none)
post_grading_tint = 0.0                          # WhiteTint: + green, - magenta (1 = 0.05 in CIE 1960 uv)
post_grading_saturation = [1.0, 1.0, 1.0, 1.0]   # ColorSaturation: about the luma (0: grey)
post_grading_contrast = [1.0, 1.0, 1.0, 1.0]     # ColorContrast: an exponent about scene grey 0.18
post_grading_gamma = [1.0, 1.0, 1.0, 1.0]        # ColorGamma: the value to the power 1 / gamma
post_grading_gain = [1.0, 1.0, 1.0, 1.0]         # ColorGain
post_grading_offset = [0.0, 0.0, 0.0, 0.0]       # ColorOffset
post_grading_shadows_saturation = [1.0, 1.0, 1.0, 1.0]     # ColorSaturationShadows .. ColorOffsetShadows
post_grading_shadows_contrast = [1.0, 1.0, 1.0, 1.0]
post_grading_shadows_gamma = [1.0, 1.0, 1.0, 1.0]
post_grading_shadows_gain = [1.0, 1.0, 1.0, 1.0]
post_grading_shadows_offset = [0.0, 0.0, 0.0, 0.0]
post_grading_midtones_saturation = [1.0, 1.0, 1.0, 1.0]    # ColorSaturationMidtones .. ColorOffsetMidtones
post_grading_midtones_contrast = [1.0, 1.0, 1.0, 1.0]
post_grading_midtones_gamma = [1.0, 1.0, 1.0, 1.0]
post_grading_midtones_gain = [1.0, 1.0, 1.0, 1.0]
post_grading_midtones_offset = [0.0, 0.0, 0.0, 0.0]
post_grading_highlights_saturation = [1.0, 1.0, 1.0, 1.0]  # ColorSaturationHighlights .. ColorOffsetHighlights
post_grading_highlights_contrast = [1.0, 1.0, 1.0, 1.0]
post_grading_highlights_gamma = [1.0, 1.0, 1.0, 1.0]
post_grading_highlights_gain = [1.0, 1.0, 1.0, 1.0]
post_grading_highlights_offset = [0.0, 0.0, 0.0, 0.0]
post_grading_shadows_max = 0.09                  # ColorCorrectionShadowsMax: the shadows' values fade out up to this luma
post_grading_highlights_min = 0.5                # ColorCorrectionHighlightsMin: the highlights' values fade in from this luma ...
post_grading_highlights_max = 1.0                # ColorCorrectionHighlightsMax: ... and weigh fully from this one
post_grading_lut_size = 32                       # r.LUT.Size: the combined table's edge (RGBA16F; 32: 0.26 MiB)
# Display rendering (U2): "film" (default; ShadingCommon.hlsli shFilm: filmic toe and shoulder, highlights roll off to
# white, scene grey 0.18 stays 0.18) or "neutral" (Khronos PBR Neutral: base colours kept, flatter).
post_tone_curve = "film"
# Camera white balance (v1.91, defect queue 6 / game request 83): true adapts the frame from the camera's white point
# (the host's UnxFrameSetWhiteBalance: correlated colour temperature K and tint Duv; 0 K = D65) to the display's D65 by
# the Bradford transform, before the tone curve. false (default), or a D65 white point: bit-identical to before.
# Automatic white balance (estimating the illuminant from the frame) is a design memo only (FEATURES_GAME 6.2).
post_white_balance = false

# Turbid basin water (v1.92, defect queue 13 (75); Passes/Water/WaterMedia.hlsl): true puts every W2 basin whose Water
# material scatters (UnxMaterialDesc v6 waterScattering sigma_s 1/m, waterAnisotropy g) into the froxel grid as a
# medium (optical depth sigma_t x path, single scattering of the sun through the surface, the local lights and the GI
# cache's ambient) and lets the sun map's beam extinction include sigma_s. false (default): clear water as before
# (bit-identical); a material with sigma_s = 0 is clear either way.
water_turbid = false

# Motion blur (A5; COVERAGE 14.12 (2); MotionBlur.cpp): the shutter's open time as a fraction of the frame interval,
# the exposure [t - s dt, t]; 0.5 = 180 degrees (the user's gate camera, 2026-09-26), 0 = instantaneous. Frames without
# motion (static camera and scene) are unchanged.
motion_blur_shutter = 0.5
# With the temporal upscale the blur runs after it, on the upscaled image at the output resolution, as the reference's
# (MotionBlur.cpp motionBlurUpscaled; MotionFlatten.hlsl, MotionApply.hlsl): the exposure is then centred on the frame's
# time (the taps go both ways along the velocity, the reference's MotionBlurAmount 0.5 = this shutter) and a blur spans
# up to motion_blur_max_percent of the output's width instead of 32 internal pixels. false: before the upscale at the
# internal resolution, as views at their own resolution always are (the exposure [t - s dt, t], the rotation stage).
motion_blur_after_upscale = true
motion_blur_max_percent = 5.0          # the longest blur, percent of the output's width (the reference's MotionBlurMax 5)
motion_blur_samples = 16               # taps along the blur, a multiple of 4 (16: the reference's r.MotionBlurQuality 4)
motion_blur_half_res_gather = true     # 16 x 16 pixel groups whose blur is longer than the taps gather once per 2 x 2
                                       # pixels (r.MotionBlur.HalfResGather): a quarter of the taps where the blur hides it
motion_blur_after_upscale_rotation = true  # ours (the reference has no such stage): after the upscale too, a camera turn
                                       # whose streak at the picture's centre exceeds 16 output pixels is blurred along
                                       # its own arcs, exact at every depth (MotionRotation.hlsl), and the gather takes
                                       # the rest of the motion. false: the gather takes the turn as any velocity, up to
                                       # motion_blur_max_percent

# Depth of field (A5; the lens is the frame's: FrameContext::lensAperture, lensFocus - no lens, no pass).
# dof_diaphragm = true: the reference's diaphragm depth of field (DiaphragmDof.cpp, Ddof*.hlsl; its DiaphragmDOF passes
# and r.DOF.* values): the circle of confusion per pixel, half-resolution gathers of the foreground, the background and
# what the foreground uncovers (radius tiles choose each kernel), bright wide-radius pixels drawn as bokeh sprites,
# the slight blur near the focus gathered at full resolution, all composed; at the internal resolution before the
# temporal upscale. false: the octave-pyramid gather (DepthOfField.cpp), kept to compare against.
dof_diaphragm = false                               # (off until a batch has looked at it: the octave path is the one that has run)
dof_diaphragm_rings = 5                             # r.DOF.Gather.RingCount, 3 .. 5: the gather kernels' rings (ring i: 8 i samples)
dof_diaphragm_max_levels = 4                        # r.DOF.Gather.MaxMipMapCount: coarser levels of the gather's input, 1 .. 4
dof_diaphragm_max_foreground_radius = 0.025         # r.DOF.Kernel.MaxForegroundRadius: the widest blur in front of the focus,
dof_diaphragm_max_background_radius = 0.025         # r.DOF.Kernel.MaxBackgroundRadius: and behind it, of the view's width
dof_diaphragm_postfilter = 1                        # r.DOF.Gather.PostfilterMethod: 0 none, 1 the 3 x 3 median, 2 the 3 x 3 largest
dof_diaphragm_recombine_pairs = 16                  # r.DOF.Recombine.Quality 2: the full-resolution gather's sample pairs (1: 12)
dof_diaphragm_stable_range_boost = 0.0              # r.DOF.TAA.SOFHistoryRejectionBoost: widens the range the full-resolution
                                                    # gather is held to near the focus (0 .. 0.125)
dof_diaphragm_scatter = true                        # r.DOF.Scatter.ForegroundCompositing 1, BackgroundCompositing: the sprites
dof_diaphragm_scatter_occlusion = true              # r.DOF.Scatter.BackgroundCompositing 2: a background sprite is hidden by
                                                    # what the gather found nearer at the pixel
dof_diaphragm_scatter_min_radius = 3.0              # r.DOF.Scatter.MinCocRadius: half-resolution pixels (at least 3)
dof_diaphragm_scatter_max_sprite_ratio = 0.1        # r.DOF.Scatter.MaxSpriteRatio: of the half-resolution 2 x 2 blocks
dof_diaphragm_scatter_neighbour_max_colour = 10.0   # r.DOF.Scatter.NeighborCompareMaxColor
dof_diaphragm_blades = 5                            # DepthOfFieldBladeCount: 4 .. 16 diaphragm blades; under 4 a disc
dof_diaphragm_full_aperture = 0.0                   # DepthOfFieldMinFstop, as the lens's widest aperture (diameter, m): the
                                                    # blades are arcs of it (at or under the frame's aperture: a disc);
                                                    # 0: straight blades (the reference's own default lens is f/1.2 wide open)
dof_diaphragm_prefilter = true                      # r.DOF.TemporalAAQuality: a jittered (upscaled) view's half-resolution
dof_diaphragm_prefilter_weight = 0.04               # picture accumulated first; the current frame's weight
                                                    # (r.TemporalAACurrentFrameWeight)
dof_diaphragm_prefilter_velocity = true             # the prefilter's history is read where each pixel's own surface was: the
                                                    # upscale's vectors (objects, deformation, the layers), made ahead of the
                                                    # upscale for it. false: by the camera's motion only
# The lens's shape (the reference's camera settings of the same names; their defaults are in its Engine module, which the
# reference checkout does not have - the values below are those defaults as remembered: all of it off).
dof_diaphragm_squeeze = 1.0                         # DepthOfFieldSqueezeFactor, 0.1 .. 10: an anamorphic lens - the bokeh is
                                                    # narrower by it (2: ovals twice as tall as wide)
dof_diaphragm_petzval = 0.0                         # DepthOfFieldPetzvalBokeh: away from the picture's centre the bokeh is
                                                    # squashed towards the centre (> 0: the swirl) or across (< 0); 0: none
dof_diaphragm_petzval_falloff = 1.0                 # DepthOfFieldPetzvalBokehFalloff: the power of the distance it grows by
dof_diaphragm_petzval_box_x = 0.0                   # DepthOfFieldPetzvalExclusionBoxExtents: a box about the centre without
dof_diaphragm_petzval_box_y = 0.0                   # it, as half extents in the picture's half sizes (0 .. 1)
dof_diaphragm_petzval_box_radius = 0.0              # DepthOfFieldPetzvalExclusionBoxRadius: its corners' radius, of the
                                                    # smaller extent
dof_diaphragm_barrel_radius = 0.05                  # DepthOfFieldBarrelRadius (m; the reference's 5 cm): the lens barrel,
dof_diaphragm_barrel_length = 0.0                   # DepthOfFieldBarrelLength (m): a tube in front of the aperture that cuts
                                                    # the sprites' bokeh away from the picture's centre (the cat's eye);
                                                    # length 0 and no flag: no vignetting of the bokeh
# DepthOfFieldMatteBoxFlags, three flags on the barrel's rim that cut the sprites' bokeh along their far edge:
# roll - where on the rim, degrees (0: the picture's right, 90: its top; ours - the reference's runs in its own lens
# frame); pitch - its tilt from the axis, degrees (0: straight ahead, under 0: closing over the opening, above: opening
# out); length (m; 0: no flag).
dof_diaphragm_matte_box_0_roll = 0.0
dof_diaphragm_matte_box_0_pitch = 0.0
dof_diaphragm_matte_box_0_length = 0.0
dof_diaphragm_matte_box_1_roll = 0.0
dof_diaphragm_matte_box_1_pitch = 0.0
dof_diaphragm_matte_box_1_length = 0.0
dof_diaphragm_matte_box_2_roll = 0.0
dof_diaphragm_matte_box_2_pitch = 0.0
dof_diaphragm_matte_box_2_length = 0.0
dof_diaphragm_depth_blur_radius = 0.0               # DepthOfFieldDepthBlurRadius: a blur by distance whatever the focus, its
                                                    # radius far away in half-resolution pixels of a 1920-wide view; 0: none
dof_diaphragm_depth_blur_km = 1.0                   # DepthOfFieldDepthBlurAmount: the distance (km) at which it is half
