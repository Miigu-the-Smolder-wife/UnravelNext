# Owner: R. ARCHITECTURE 2.8, 2.12.
[raytracing]
character_proxy_triangles = 8000
proxy_error_px = 1.0                   # a character's RT proxy cut: the coarsest whose error is at most this many pixel
                                       # footprints at its distance (every R ray's footprint there is at least one pixel's)
skinned_proxy_cuts = "skin_aware"     # skinned RT proxies: R's skin-aware cuts ("skin_aware"), or V's cluster LOD cuts
                                       # ("cluster_lod": bind-pose error only; tests of the proxy mechanism)
proxy_skin_weight = 4.0                # skinned proxies: cost of collapsing across skin weights (skinAwareCuts; the
                                       # skin-weight centroid attribute against the positional error). At 4 the posed error
                                       # tracks the bind error (measured 0.93-1.32x, host_dynamic tube, ProxyLevels)
emitters = true                        # analytic area lights as ray geometry (design 12.4 structure 2: G/M reflection rays
                                       # see the lights M marks stable, FrameResources::areaLightStable; GI rays store their
                                       # radiance in the cache's emitter texels, apart from the texels; those feed the K path
                                       # (probe maps) and glass/water, so M skips the lights' LTC specular in the main view.
                                       # Ray hits read the texels alone with their NEE sample; planar views shade by LTC)
hair = true                            # strand hair on rays (RayTracing/HitHair.hlsli): the grooms' proxy for the reflection
                                       # rays, the final gather's, the radiance cache's and the translucency volume's rays is
                                       # E's density volume (shading.hair_density_*), not geometry in the TLAS - a ray's first
                                       # fibre in the volume (drawn per ray: a groom is as opaque to rays as its fibres make
                                       # it) is a hit, lit as a matte surface of the hair material's base colour facing out of
                                       # the groom: the sun and one local-light sample, each through its shadow ray and the
                                       # hair in front of it, and the previous frame's translucency volume as its indirect
                                       # light. Mirrors show the grooms and bounce light is blocked by them (Unreal traces its
                                       # hair voxels on the gather's and the reflections' rays and takes the hit as black).
                                       # The radiance cache's and the translucency volume's rays leave out a groom they start
                                       # inside (the strands take a cell's light through their own hair themselves). Costs a
                                       # box test per body with a block on each such ray and the march where a box is crossed.
                                       # Not on: shadow rays of hits and cards, refraction rays
proxy_error_model = "measured"         # a cut's error for the choice: "measured" = bind-pose Hausdorff x proxy_posed_factor,
                                       # "bound" = the certified posed bound (50-170x the measured error; tests)
proxy_posed_factor = 1.5               # posed / bind-pose error margin of skin-aware cuts (measured up to 1.32)
near_characters_with_proxy = 64
dynamic_tlas_instances_max = 100000
see_through_translucent = true   # Glass / Water surfaces are not there for the GI rays and the shadow rays (the reference
                                 # keeps translucent meshes out of its Lumen scene): sky and sun light enter a room through
                                 # its windows in the bounce light as they do in the view. An instance made of such materials
                                 # alone is left out by its mask; a pane that shares a mesh with opaque submeshes (a window
                                 # in its frame) is non-opaque geometry the any-hit shader ignores for those rays.
                                 # Reflection and refraction rays still meet them. A shadow ray shot from a ray hit takes
                                 # what the Glass it crosses leaves of the light (the pane's tint; RayShaders.hlsli
                                 # rtShadowTransmittance); the cards' direct light stores one bit a texel and light, and
                                 # takes Glass as clear. false: such meshes stop GI rays as opaque surfaces (the behaviour
                                 # until 2026-10-03). A ray traced FORCE_OPAQUE (surface_cache.shadow_rays_opaque) runs no
                                 # any-hit shader: a pane inside a mixed mesh stops it
exact_set_max = 8                      # reflection exact set: skinned instances traced with their original mesh (ARCHITECTURE 2.6)
exact_set_min_hits = 64                # M/G reflection hits in a frame for an instance to enter it
experiment_disable = 0                 # cost attribution only (recorded in the quality hash): 1 = build every deformed BLAS
                                       # every frame instead of refitting, 2 = reflection exact set by hit count alone
                                       # (without the proxy error criterion), 4 = dynamic TLAS descriptors copied to
                                       # video memory before the build, 8 = dynamic TLAS built with PREFER_FAST_BUILD,
                                       # 16 = proxy cuts chosen by V's bind-pose error alone (not the posed bound).
                                       # Never nonzero outside measurements.
