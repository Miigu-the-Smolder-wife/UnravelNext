# Owner: R. ARCHITECTURE 2.8, 2.12.
[raytracing]
character_proxy_triangles = 8000
proxy_error_px = 1.0                   # a character's RT proxy cut: the coarsest whose error is at most this many pixel
                                       # footprints at its distance (every R ray's footprint there is at least one pixel's)
near_characters_with_proxy = 64
dynamic_tlas_instances_max = 100000
exact_set_max = 8                      # reflection exact set: skinned instances traced with their original mesh (ARCHITECTURE 2.6)
exact_set_min_hits = 64                # M/G reflection hits in a frame for an instance to enter it
experiment_disable = 0                 # cost attribution only (recorded in the quality hash): 1 = build every deformed BLAS
                                       # every frame instead of refitting, 2 = reflection exact set by hit count alone
                                       # (without the proxy error criterion), 4 = dynamic TLAS descriptors copied to
                                       # video memory before the build, 8 = dynamic TLAS built with PREFER_FAST_BUILD.
                                       # Never nonzero outside measurements.
