# Owner: core. Quality parameters (ARCHITECTURE_KO.md 6, 7.0; INTERFACES_KO.md 9): one file per track under
# Config/quality, keys only under the file's own namespace, no code defaults. Every performance report records the
# SHA-256 of the merged effective values.

[output]
# Measurement and gate resolutions (output resolutions). The harness refuses anything else. 1080p: the mainstream target
# with 1440p (user 2026-09-28).
resolutions = ["3840x2160", "2560x1440", "1920x1080"]
# Banded pass groups (RenderGraph::addBandedGroup, passBandCount): pixels per band, so a band's intermediate buffers stay
# in L2 between producer and consumer passes; 0 = one band (the whole view). Default 0 (v1.31): with only M's passes
# banded at 4K / 8 = 1036800 (8 bands at 4K, 4 at 1440p) M measured city 4K 6.725 -> 6.800 ms (shading is latency-bound,
# the L2 hits do not pay for the per-band barriers yet). Measure again at 1036800 when shading nears its floor.
band_pixels = 0
# Async compute (RenderGraph::setAsyncPasses): the named passes run on the compute queue, every other pass on the graphics
# queue; the declared uses order them (fences where a pass reads what the other queue wrote). Off: measured slower in all
# four cases [84e789f, RTX 4080, 600 frames, median ms, internal 960p / 720p]: train 1440p 5.41 / 5.44 async vs 5.29 / 5.36
# serial, bath 1440p 6.29 / 6.30 vs 6.10 / 6.09, train 1080p 3.84 / 3.86 vs 3.81 / 3.76, bath 1080p 4.60 / 4.51 vs
# 4.43 / 4.37 (the list was: TLAS builds, froxel integration and GI's block; + "s.shadow.*": train 1080p 3.76 / 3.71,
# the rest still slower). The fences (62-80 us each, RenderGraph.h) and the two queues sharing the SMs of latency-bound
# kernels cost more than the overlap gave. [] = one queue.
async_compute_passes = []
# Temporal upscale (user decisions 2026-09-28: internal resolution + temporal upscale for the 4K budget, then for 1440p
# and 1080p as well): outputs of at least render_scale_min_height render the main view at output height x render_scale,
# at most render_height_max (same aspect), with a sub-pixel jitter, and M's temporal upscale
# (Passes/Shading/Upscale.cpp) reconstructs the output resolution before the post chain; M's texture footprints are
# those of the output pixel (FrameConstants::upscaleRatio). render_scale 1 = off (native everywhere).
# 2/3: 4K renders 2560 x 1440, 1440p 1707 x 960, 1080p 1280 x 720 (0.44 of the pixels); outputs below 1080 stay native.
render_scale = 0.6667
render_scale_min_height = 1080
render_height_max = 1080               # 4K renders 1920 x 1080 and is upscaled x 2 (was 1440: 2560 x 1440. On the RTX 4080 the four
                                        # game scenes took 17.7-18.7 ms at 4K with it against 9.4-10.3 ms at 1440p, 2026-10-02)
# Quality tier (the reference's scalability groups): Config/quality/tiers/<tier>.toml is laid over these files
# (QualityConfig::applyTier). "epic" = the files as they are; "high" = the frame-rate tier (coarser probes, rays and
# samples at the same internal height); "performance" = a lower internal height.
tier = "epic"
# The upscale's reconstruction (Passes/Shading/Upscale.hlsl): each frame's jittered samples weighted by exp(-K d^2), d in
# output pixels (K 60: sigma 0.09 output px), accumulated over the 64-position Halton cycle, so a still image converges to
# the native point sample; the history keeps at most upscale_history_frames frames of that weight where the pixel is
# still and upscale_history_frames_moving where it moves (each moving frame resamples the history: a long one blurs).
# CPU model (Tools/ImageQuality, band 0.25-0.5 cycles/px against native, 2/3 scale): still energy 0.92 / SSIM 0.996,
# 1.4 px/frame pan 0.56 / 0.92 (the 974c6bb kernel: 0.10 / 0.78 and 0.03 / 0.77).
upscale_kernel = 60.0
upscale_tsr = true                      # the temporal upscale in the structure of Unreal's TSR (Passes/Shading/Tsr.hlsli): dilated
                                        # vectors with parallax disocclusion, a low-resolution guide history and the shading rejection
                                        # measured against it, spatial anti-aliasing where the history is rejected or missing (the
                                        # frame after a cut), a history of 16 samples held to 4 where the pixel moves an output pixel
                                        # a frame and to 2 where rejected. false: the one-pass accumulation below (upscale_kernel,
                                        # upscale_history_frames*, which the TSR path does not read)
upscale_tsr_kernel_by_samples = true    # with upscale_tsr: the update's kernel narrows as the pixel's samples can fill it (factor sqrt(n)
                                        # for n samples gathered, up to the output pixel's): after a cut the picture sharpens over 4
                                        # frames at x 2 (9 at x 3) without the input's lattice on small bright detail. false: the
                                        # reference's rule (an output pixel wide from the second frame)
upscale_tsr_flickering = true           # with upscale_tsr: the flickering heuristic (TsrFlicker.hlsl; the reference's
                                        # r.TSR.ShadingRejection.Flickering): a still pixel whose luma flips every frame with the
                                        # jitter (tile joints, gratings) keeps its history inside the flicker's amplitude
upscale_tsr_reprojection_field = true   # with upscale_tsr: the reprojection field (TsrDilate.hlsl; the reference's
                                        # r.TSR.ReprojectionField, on from its high tier up): per internal pixel the vector's
                                        # jacobian - every output pixel reprojects to its own place under a turn or a zoom, the
                                        # history stays sharp - and on an edge whose sides move apart the boundary inside the
                                        # pixel, so an output pixel takes the vector of the side it lies on (no smear one input
                                        # pixel wide along moving edges). false: one dilated vector per internal pixel
upscale_tsr_reprojection_field_aa_speed = 0.125  # output pixels a frame the two sides of an edge must move apart by before the
                                        # boundary is found from the depth edge (r.TSR.ReprojectionField.AntiAliasPixelSpeed);
                                        # slower edges give the whole pixel to the foreground
upscale_tsr_resurrection = false        # (off as the reference's default, until one batch has measured its cost and picture)
                                        # with upscale_tsr: history resurrection (TsrResurrect.hlsl; the reference's
                                        # r.TSR.Resurrection, off in its defaults): the history keeps every 31st frame (two of them,
                                        # its Resurrection.PersistentFrameInterval / PersistentFrameCount) beside the previous one;
                                        # a pixel whose history is rejected or was hidden in the previous frame takes the kept
                                        # frame's converged colour where that matches what it shows now (a door that closes again,
                                        # the wall behind a passer-by, a view turned back) instead of starting from this frame's
                                        # samples. Costs two more histories and guides (4K output at 100 %: 2 x 63 MiB) and one
                                        # more reprojection and measure of the guide. false: the two-frame history
upscale_tsr_history_percent = 100.0     # (100 until measured: 200 at a 4K output is an 8K history and four times the update's pixels)
                                        # with upscale_tsr: the history's size, percent of the output's per axis (100 .. 200; the
                                        # reference's r.TSR.History.ScreenPercentage, 200 on its epic tier): above 100 the history
                                        # holds detail beyond the output's pixels, each reprojection resamples it with less blur,
                                        # and m.tsr.resolve filters it down to the output (TsrResolve.hlsl). 200 at a 4K output: an
                                        # 8K history (253 MiB a slot, 2 slots, 4 with resurrection) and the update over 4 x the
                                        # pixels - the tiers below epic keep 100
upscale_tsr_thin_geometry = true        # with upscale_tsr: thin geometry detection (TsrThin.hlsl; the reference's
                                        # r.TSR.ThinGeometryDetection, there on with its foliage): geometry under a pixel wide
                                        # changes its share of the pixel with every jitter offset and would be rejected as a
                                        # change of shading - it flickers or vanishes. The coverage layer's thin fragments (their
                                        # share of the pixel, where the reference counts hits) and pixel-wide lines of depth
                                        # relax the rejection's clamp box to the history's own neighbourhood. false: no relaxation
upscale_tsr_thin_geometry_error_multiplier = 200.0  # a line of depth is thin geometry where it stands out from both sides by
                                        # this many pixel sizes in the world (r.TSR.ThinGeometryDetection.ErrorMultiplier)
upscale_tsr_thin_geometry_max_relaxation = 0.037    # the relaxation weight inside thin geometry's clusters, where the
                                        # coverage is near a half (r.TSR.ThinGeometryDetection.Coverage.MaxRelaxationWeight)
upscale_tsr_thin_geometry_line_contrast = 0.30      # a pixel-wide line of luma is thin geometry too where it is brighter than
                                        # both sides by this much in the guide space (...Coverage.MinKeepLineContrast); such a
                                        # line is kept in the coverage history and the pixels around it are relaxed. 0: none
upscale_tsr_thin_geometry_line_fade_rate = 0.1      # the chance a frame that a kept line is not a line drops it
                                        # (r.TSR.ThinGeometryDetection.HighContrastLineFadeRate; 0 never, 1 at once), and
upscale_tsr_thin_geometry_line_fade_rate_inside = 0.03  # inside thin geometry's coverage (...FadeRateInsideRegion)
upscale_tsr_thin_geometry_line_weight = 0.6         # the relaxation weight around a kept line where no cluster weight is
                                        # (r.TSR.ThinGeometryDetection.HighContrastLineWeight)
upscale_tsr_thin_geometry_anti_flickering = true    # the flickering heuristic measures with the thin geometry's relaxed
                                        # clamp and counts its small gradients (r.TSR.ThinGeometryDetection.AntiFlickering)
upscale_tsr_hole_filling = true         # with upscale_tsr: a pixel that was hidden in the previous frame reads the history
                                        # by its occluder's vector - what was beside the occluder - instead of its own, which
                                        # leads to the occluder (the reference's reprojection hole filling; no switch there)
upscale_layer_motion = true             # with upscale_tsr: the layers over the opaque surface move by themselves
                                        # (UpscaleMotion.hlsl; the reference's translucent velocity output and has-pixel-animation
                                        # mark): a glass pane, the water surface and the coverage layer's thin fragments (a third of
                                        # the pixel or more) give the pixel their own vector and depth; particles and see-through
                                        # fragments, which have no vector, hold the history's clamp and shorten it by their opacity,
                                        # and a glass or water whose background moves otherwise holds the clamp. false: every pixel
                                        # moves as the opaque surface behind its layers (they smear when either moves)
screen_trace_source = 0                # the previous frame colour screen-space traces read (GI, reflections): 0 = the scene colour
                                        # before the upscale, as the reference (r.Lumen.ScreenTracingSource 0), kept with its
                                        # frame's depth in alpha - the traces' history depth test (UpscaleSceneKeep.hlsl);
                                        # 1 = the upscale history (anti-aliased, output resolution; no history depth test)
upscale_history_frames = 64
# Moving: 4 (8 before 2026-09-29) with the Lanczos-3 moving history and its min / max clip (Upscale.hlsl): more of the
# detail stays in the CPU model's slow pans (SSIM 0.73-0.77 -> 0.86-0.87 at 0.2-0.45 px / frame).
upscale_history_frames_moving = 4
