# Owner: FX. GPU simulation (ARCHITECTURE 2.9, 2.14; WORLD_VFX_DESIGN_KO.md 3.3). These are sizes and structure, not
# qualities: the simulated population (the VFX stream's slot capacity), the per-particle arithmetic and the sort are
# never reduced by them.
[fx.particles]
chain_depth_max = 4          # same-tick GPU child cascade depth (user decision, design 8.1 (b); NV_STREAM_MAX_DEPTH)
readback_slots = 4           # tick ring (upload, events, readback): ticks in flight before the CPU reads them
collision_cell_m = 1.0       # collision candidate grid cell (m): a size (the candidates are always a superset of the
                             # surfaces a segment can hit, so the results do not depend on it)
collision_readback = 4096    # collision events copied with the tick; more are fetched from the tick's GPU event buffer
                             # when the CPU reads the tick (exact either way)
mesh_instances_max = 65536    # mesh particles (A3): scene instances the GPU writes per frame (RuntimeCapacity::gpuInstances);
                             # live mesh particles past it are counted (MeshParticleStats::overflow), a size to raise, never a cap
soft = true                  # sprites as balls of their radius (FxLayerTile.hlsl): where a surface cuts a sprite, its opacity
                             # is the part of the ball in front of the surface, so it meets the surface without an edge
                             # (Unreal's depth fade / spherical particle opacity). false: a plane at the centre's depth
near_fade = true             # a sprite whose ball reaches the near plane fades out instead of covering the view
ribbon_segments = 8          # ribbon tessellation: pieces a strip segment is drawn in at most - the cubic through its two points
                             # with the strip's tangents, one piece per 7.5 degrees of turn (1: straight segments; 16 at most)
shadows = true               # the sun's particle transmittance map (FxShadow.hlsl): the sprites of the looks that cast a shadow
                             # darken the surfaces under them (S's screen visibility) and the lit particles behind them
shadow_resolution = 512      # its texels a side (16..2048); with the extent, a texel's size (512 over 2 x 64 m: 0.25 m)
shadow_extent_m = 64.0       # half its side across the sun's direction, around the main camera (m)
shadow_depth_m = 256.0       # the depths along the sun's direction it holds: the camera's +- this (m)
experiment_disable = 0       # timing attribution only, never a product setting: bit 1 (unused: volumes are records), 2 ribbon strips,
                             # 4 (unused: the sort moved to the render pass), 8 collisions (no surfaces, no grid), 16 context and world fields,
                             # 32 noise, 64 fields read from buffers instead of the constant
                             # buffer (A/B); the outputs are then incomplete (not 64)
