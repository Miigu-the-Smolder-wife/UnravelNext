# Owner: S. ARCHITECTURE 2.3, 2.4, 2.11.
[shadow.vsm]
# L3 stage 1 (14.3-1/2, A): classification pages - every active shadowed light's six faces at 128 texels, conservative
# raster with the nearest depth over each texel (VsmClsPixel), blocks of 8 texels, and per 8x8 tile of the main view the
# froxel-list entries lit over every pixel (LocalTileClassify; exact: no caster nearer than the pixel in its texel's block).
# TileLights takes a lit caster FAR. Off until verified (LocalShadowTests: lit => fine visibility 1).
classification_pages = false
classification_tolerance = 0.002   # relative reversed-Z depth the pixel's own surface may exceed its texel's nearest caster by
classification_twin = false        # stage 2: the exact-raster twin pages (standard raster, texel-centre depth): a (tile, light) whose
                                   # pixels all have, in every texel of their blocks, a caster nearer than themselves is umbra (left out)
virtual_resolution = 16384      # per clipmap level (compiled into the S kernels)
page_texels = 128               # (compiled)
clipmap_levels = 20             # level k covers 2^(k+4) m, texel 2^(k-10) m (compiled): 1 mm .. 512 m, window 16 m .. 8192 km
pool_pages = 4096               # minimum atlas pages (one path: 128^2 D32 slots, 64 KB + 11 KB blocks each)
pool_pages_per_mpixel = 700     # initial atlas per main-view megapixel (4K: 5824 pages); grows on exhaustion (VsmSystem.cpp)
pool_pages_per_local_light = 160  # plus per shadow-casting local light (24 lights under a roof at 720p requested ~120 each)
lod_bias = 0.0                  # level = floor(log2(pixel footprint / level-0 texel)) + bias: texel <= footprint
receiver_bias_texels = 1.0      # receiver-plane tolerance, texels of the compared level (x (1 + plane slope)); no lateral shift
receiver_lod_texels = 2.0       # added to it per pixel of visibility.lod_error_px: the visible surface is a LOD cut that may lie that
                                # far inside the casters' cut (a pixel footprint is 1 .. 2 texels of its level). 0: curved surfaces
                                # show facet-sized self-shadow specks where the two cuts differ [measured: shading_ball]
screen_ray_length = 0.015       # the sun's contact ray across the depth buffer, as a fraction of the pixel's view depth (reference:
                                # r.Shadow.Virtual.ScreenRayLength 0.015): the shadow of the last centimetres under a caster, which
                                # the map's receiver tolerance leaves lit (objects float). 0: off
screen_ray_steps = 8            # depth-buffer samples along it (0: off; at most 16)
max_receiver_slope = 8.0        # clamp of the receiver plane's light-space gradient (surfaces within ~7 deg of grazing)
height_margin_m = 500.0         # caster height range margin (dynamic casters) around the scene's bounds
cache_min_change_texels = 0.5   # what makes a cached sun page stale (VsmCache.hlsl): a moved caster at least this many of the level's
                                # texels in radius; a wind-moved one once the wind can have moved it this far since the page was drawn
                                # (coarse levels never, middle levels every few frames). 0: every changed caster, every frame
min_caster_texels = 1.0         # a shadow view (a sun level, a local light's face mip) leaves out the instances whose bounding
                                # sphere is under this many of its texels in radius (V's instance cull; perspective faces: at the
                                # sphere's nearest point). A coarse level gets less than a texel from such a caster, and a forest's
                                # coarse levels each drew every tuft of grass (s.vsm.raster10 over its lists, the VSM group 99 ms).
                                # What it shows: small casters stop casting where the level in use is coarser than they are - a
                                # 0.3 m tuft from the 0.5 m level on (receivers past about 500 m at 1080 lines), a 4 m tree from
                                # the 8 m level on - and with them the summed shade of many such casters (a far meadow's or a far
                                # stand's darkening of the ground under it). Blocker searches and wide penumbrae that read a
                                # coarser level than the receiver's miss them the same way. The requests' packing bounds leave
                                # the same casters out. 0: every caster in every view (A/B)
static_separate = true          # sun pages keep a static copy (the reference's r.Shadow.Virtual.Cache.StaticSeparate): the casters
                                # that are not movable (not Dynamic, Skinned, Wind or a view model, no morph or terrain patch,
                                # uploaded with the scene) are drawn into a second atlas, the movable ones into the sampled page,
                                # and the static copy is merged in under the depth test. A page under a changed movable caster
                                # keeps its static copy: only the movable casters there are drawn again (1,024 movers made their
                                # pages redraw the whole city under them every frame). The sampled page holds what one raster of
                                # all its casters gives - a depth buffer keeps the nearest fragment in any order. Costs a second
                                # atlas (64 KB per page: 256 MB at 4096 pages) and a second family of sun raster requests
                                # (s.vsm.static*). Needs cache. false: one atlas, a changed caster redraws its pages whole (A/B)
local_request_views = 4032      # local lights' page views (42 per light: 6 faces x 7 mips) in one of V's raster requests - one
                                # cull chain per request, so 96 lights share one where the list capacity allows it
                                # (visibility.max_visible_clusters still splits them). 252: six lights per request, the limit
                                # of V's 8-bit view field before the 16-bit one (A/B). Only without shading.mega_lights: with
                                # it S draws no local page
static_hzb_cull = true          # with static_separate: the movable casters' views are culled against the HZB of the pages' static
                                # copies (VsmStaticHzb.hlsl; the reference's per-page HZB): an instance, hierarchy node or cluster
                                # that lies under the static surface in every page it would be drawn into is not drawn - after the
                                # merge it would have no texel (cars under bridges and roofs, actors indoors). The pages hold the
                                # same depth. Costs 1.4 KB per page and one pass that reads the static copies drawn in the frame.
                                # false: every movable caster in the frustum of a drawn page is rastered (A/B)
cache_hzb_filter = true         # a changed caster makes a cached sun page stale only where it can show in it: a caster whose
                                # bounding sphere lies under the page's stored surface over its whole footprint there (the page's
                                # block hierarchy, its HZB) has no texel in the page before or after the change, so the page stays
                                # (the reference's HZB-filtered invalidation: movers under roofs, bridges, canopies). The pages
                                # hold the same depth as a redraw would give. false: every page under a changed caster (A/B)
cache = true                    # sun page cache (VsmCache.hlsl; a design choice): a requested sun page keeps its content
                                # when it was resident last frame and no changed caster (moved, deformed, skinned, wind, morph,
                                # shown / hidden) touched it; the sun, the caster range, a scene revision, an origin rebase or a
                                # restore redraws every page (the one path, the budget's worst case). false = the one path always
coarse_pages = 2                # the pages around the camera on the coarse levels are requested every frame (VsmMarkCoarse; the
coarse_level_first = 9          # reference's coarse pages, r.Shadow.Virtual.MarkCoarsePagesDirectional): coarse_pages per axis
coarse_level_last = 16          # (2: the reference's four) on each level of [first, last] - texel 0.5 m .. 64 m, at least 32 m ..
                                # 4 km around the camera, 32 pages. Ordinary cached pages: drawn once, redrawn when a caster under
                                # them changes by a texel of theirs. A lookup with no page on its own level walks up to them: the
                                # frame after a cut whose requests ran past the atlas, reflection and GI hits outside the view,
                                # planar views. Pixels with their own page read that, as before. 0: no coarse pages (A/B)
page_dilation = 0.05            # a pixel within this fraction of a page of its page's border also requests the page across it (the
                                # reference's PageDilationBorderSizeDirectional 0.05): its search and penumbra taps find that
                                # neighbour on the pixel's own level where they fell back to a coarser ancestor. More requested
                                # pages near borders; the shadow there is read at the finer texel. 0: the pixel's page alone (A/B)
fold_small_passes = true        # the page update's and the visibility's small dispatches share passes (PassChain.h): the
                                # counters' clear with the cache's reset; the request propagation, the cache's keep and free
                                # list and the scan's three steps; the pixel list's clear with the visibility pass; the
                                # overflow scan's two levels. The same dispatches in the same order, a barrier between them.
                                # And a view without local shadow slots (shading.mega_lights shadows the local lights) records
                                # no overflow count, scan and fill: they ran over an empty tile list. false: a pass each (A/B)
use_stats = 0                     # 1: count which sun pages lookups read, by request kind (measurement only; RendererGate)
subtile_stats = 0                 # 1: count the 32^2 sub-tiles of requested pages that pixels sample (measurement only)
fragment_check = 0                # 1: the fragment pass evaluates every coverage record and counts those whose settled pixel
                                  # value differs by more than 1/255 (verification only; VSM stats words 25..28, RendererGate)
sun_refresh_error = 0.00196       # VsmTests only: the moving-sun steps are multiples of (pi / 2) tan(theta_s) x this (the one
                                  # path draws every level on the current sun every frame; no basis age)
search_taps = 5                 # blocker-height taps (2 x 2 texels each) over the reach disk
filter_taps = 16                # penumbra occupancy taps over the disk of radius d_b tan(theta_s); 16 = knee of the measured error (VsmTests)
local_lights_max = 128
page_sort_tile_px = 64
overflow_filter_queue = true   # same filter in two stages; excess queue items execute inline (A/B: false)
raster_split = true            # V raster requests packed so the views' structural bounds (casters each view can reach x their
                               # hierarchies' clusters) fit visibility.max_visible_clusters; false = one sun request, 6 lights
                               # per local request (A/B: their lists can overflow)
raster_lod_bound = true        # the packing bound per view: a caster adds the clusters its LOD cut can hold at that view's texel
                               # size (the builder's error tables, MeshRange::cutBoundAt), not its leaves in every view; false = leaves (A/B)
overflow_capacity_words = 0     # overflow list capacity (INTERFACES 7.3): 0 = automatic (1.5 x need); > 0 forces it (tests: 1 sends every
                                # overflow tile to M's fallback). A size, not a quality: results are exact either way
