# Owner: S. ARCHITECTURE 2.3 (LUT sizes and quadratures), 2.4 (froxels).
[atmosphere]
transmittance_lut = [256, 64]        # Bruneton parameterisation, optical depth RGBA32F
transmittance_steps = 128            # Gauss-Legendre-4 segments per texel (convergence: Tests/AtmosphereTests)
# Multiple scattering: the exact source table J_ms (MsBuild.hlsl, S_STATUS_KO.md 8), rebuilt only when the medium or the
# ground albedo changes (not with the sun). Convergence of every count: Tests/AtmosphereTests.
multiscatter_table = [32, 64, 128, 32]  # (nu, sun cosine, view cosine: two halves at the horizon, radius): 64 MiB
                                      # R16G16B16A16_UNORM log J; a frame reads only the sun cosines near its sun
multiscatter_orders = 8              # orders iterated (>= 2) + geometric tail J_N q / (1 - q)
multiscatter_sh_order = 32           # scattering densities by spherical harmonics (Funk-Hecke): Rayleigh exact (l <= 2),
                                     # Henyey-Greenstein exact up to g^(L+1) (6e-4 at g = 0.8); <= 48 (MS_SH_MAX)
multiscatter_sh_grid = [64, 128]     # projection grid: elevation nodes per half (square-root spaced from the horizon),
                                     # azimuth nodes over [0, pi] (the radiance is symmetric about the sun's plane)
multiscatter_directions = 2048       # hemisphere directions of the ground's irradiance from scattered light
multiscatter_steps = 128             # quadratic-spaced exact-exponential steps along each texel's ray
rebuild_every_frame = 0              # 1: rebuild the transmittance LUT and J_ms every frame (measurement only: build cost)
# Sky view = the previous engine's far-field table at the camera altitude: 192 azimuths over [0, pi], 128 elevations
# (64 per side of the true horizon, as the previous engine's 64 per half; the first draft's 108 was coarser).
sky_view_lut = [192, 128]
sky_view_segments = 128              # quadratic segments x Gauss-Legendre 4 along each sky ray

# Height fog (Passes/Atmosphere/Fog.hlsli): the reference's exponential height fog with volumetric fog, as one more medium
# of the air volume - lit by the sun through the casters' shadow (shafts of light), by the local lights and by the indirect
# light. The numbers are the reference's placed-fog defaults turned to metres (FogDensity 0.02 -> 0.002 / m,
# FogHeightFalloff 0.2 -> 0.02 / m, volumetric scattering distribution 0.2, albedo white, extinction scale 1).
# The cloud layer (CloudSystem.cpp; a frame turns it on with a coverage: FrameContext::clouds, the gate's --clouds).
[atmosphere.clouds]
sun_steps = 12                       # (Q) a sample's path toward the sun is marched this many steps (20 m, doubling every second step
                                     # from the fifth: 12 steps reach 1,280 m), then the sun map gives the rest. 0: the whole path in
                                     # 20 m steps (up to 256 of them at a low sun - 5.7 ms a frame at 1080p against the layer's shape
                                     # error of about 1 %)
temporal = true                      # of each 2 x 2 block of the layer's texels one is marched a frame, the others take last
                                     # frame's value where the previous view saw their direction; the rays' sky dome is refreshed
                                     # 16 rows a frame. false: every texel and the whole dome every frame

[atmosphere.fog]
enabled = false                      # off unless the game asks for it (as the reference: a level has fog when a fog actor is placed).
                                     # The batch of 2026-10-02 had it on everywhere: the sky and distant ground veiled grey, the
                                     # interiors' ceilings hazed - a look to choose per scene, not a default
density_per_m = 0.002                # extinction per metre at height_m (x extinction_scale)
height_falloff_per_m = 0.02          # the density halves every 1 / this metres of height
height_m = 0.0                       # the height (scene y) the density is given at
albedo = [1.0, 1.0, 1.0]             # scattering colour (scattering = density x albedo)
extinction_scale = 1.0
phase_g = 0.2                        # Henyey-Greenstein asymmetry (VolumetricFogScatteringDistribution)
start_distance_m = 0.0               # no fog nearer than this
indirect_light = true                # the Lumen translucency volume (the previous frame's) lights the fog
noise_amount = 0.3                   # the density's variation about its mean inside the volume (0: a uniform medium; 0.5: from nothing
                                     # to twice the mean) - what a shaft of light or a lamp's glow shows of the fog itself
noise_scale_m = 20.0                 # its largest features (the second octave is half of it; half as tall as wide)
noise_drift_mps = 0.3                # the variation drifts with the scene's wind x noise_wind_scale, in still air along x at this speed
noise_wind_scale = 1.0
# The fog's volume (FogVolume.hlsli; the reference's volumetric fog grid: 8 px x 128 slices at Epic, 16 x 64 at High, to 60 m)
cell_px = 16                         # (Q) pixels per cell (4 .. 64, a power of two)
depth_slices = 96                    # (Q) slices to volumetric_distance_m: slice = log2(depth x 32 / distance + 1) x slices / log2(33)
volumetric_distance_m = 80.0         # the cells' end; farther fog is the height fog's closed form, lit by the sun without casters,
far_slices = 16                      # integrated per column into this many more slices (equal steps of log depth) out to
far_distance_m = 65536.0             # this distance
far_shadows = true                   # the far slices' sun term outside the casters' shadow, as the air volume found it for its own
                                     # slices (a ridge against a low sun shades the fog in front of it); false: no casters out there
history_weight = 0.9                 # the history's share of a cell each frame (the reference's 0.9), the sample point jittered per frame
shadow_texels_per_cell = 1.0         # the sun's shadow in a cell is read at the page level whose texel is the cell's width / this
local_volumes = true                 # the frame's local fog volumes (FrameContext::fogVolumes: steam, mist in a hollow): extra density in
                                     # the fog's cells, lit as they are; the volume runs for them alone when the height fog is off
on_rays = true                       # reflection rays take the fog along them (the reference's Lumen.SampleFog): its closed form's
                                     # transmittance, lit as the volume is around the reflecting surface. false: reflections show what
                                     # they hit without the fog between
secondary_views = true               # planar reflection views get their own volume (up to four a frame; no history): a lake reflects
                                     # the fogged shore and sky. false: mirrors show the world without fog
debug_view = false                   # measurement only: the fog alone per pixel (FogDebug.hlsl) for the gate's capture layer "fog"
sky_amount = 1.0                     # how much of the fog sky pixels take (1: the sky through the fog, as every other pixel - a height
                                     # fog covers the horizon and thins toward the zenith; 0: the sky left clear, the look of a
                                     # sky dome painted with its own haze)

[atmosphere.froxels]
integration_queue = true             # same air-slice estimator in dense waves; false is the tile-scheduled A/B path
tile_px = 24
tile_reference_height = 720          # tile_px holds for main views up to this height; a higher one gets tiles larger in proportion
                                     # (1080 internal: 36 px) - the grid keeps its angle per tile, and the lists, the air volume and the
                                     # sampled local light cost the same at every output. 0: tile_px at every resolution
depth_slices = 64                    # exponential in view depth between near_m and far_m (<= 64: one thread per slice)
lights_max = 32                      # ordered head of each froxel list (even, <= 96, FROXEL_SORTED_MAX): the strongest lights by
                                     # importance come first; every other light reaching the froxel follows (nothing is dropped
                                     # or merged, RENDERER_REDESIGN_V2 14.1)
list_capacity_forced = 0             # tests only (0: off): entry capacity of the lists buffer. Normally the capacity is an upper
                                     # bound of the scene lights' entries (FroxelSystem.cpp froxelListBound) + an allowance for FX
                                     # particle lights grown from the measured need; a frame needing more lists the scene lights alone
                                     # (their own allocation, inside the bound) and leaves the FX lights out, counted (gates require 0)
list_fallback_forced = 0             # tests only (0: off): 1 makes the fill pass list the scene lights alone, as a frame over the capacity does
clip_at_surface = true               # a slice that holds the tile's farthest surface samples its light (the casters' shadow, the fog's
                                     # lights) in front of that surface only: past it the tile's ray is behind the wall (FroxelSlice.hlsli)
near_m = 0.5                         # slice 0 spans the camera .. near_m (far / near)^(1/64)
far_m = 65536                        # last node of the air volume (air perspective to 64 km; depths beyond clamp)
experiment_disable = 0               # cost attribution only (never in a verdict): 1 air shadows, 2 local lights, 4 air integration,
                                     # (A/B switch, not a disable: 1024 = L4 bounded VSM walk omission in the air, RENDERER_REDESIGN_V2 14.4:
                                     #  a shadowed light under 1e-3 of the slice's in-scatter is added lit; off by default until measured)
                                     # 8 sun transmittance per substep, 16 multiple scattering per substep, 32 walk stops at pages,
                                     # 64 local lights' air shadows, 128 one lane per shadowed local-light item (test reference)
walk_stats = 0                       # 1: count the air shadow walk (slices, mixed, block and texel loads) into the VSM
                                     # stats (RendererGate); measurement only; also the shadowed items lit over the L3 pages, omitted, walked
walk_omission = false                # L4 (RENDERER_REDESIGN_V2 14.4): a shadowed local light under 1e-3 of the slice's in-scatter is added lit
                                     # without its VSM walk (error <= 1e-3 of the slice; = experiment_disable bit 1024). Off until measured.
air_step_altitude_m = 100            # air integration substeps: at most this altitude change per step and at most min(H_R, H_M) / 12
                                      # (midpoint error (dh/H)^2/24 <= 0.03 %; FroxelSystem.cpp)
shadow_texels_per_tile = 4           # air shadows: VSM level with texel <= tile width / 4 (boundary placement, VsmAir.hlsli)
