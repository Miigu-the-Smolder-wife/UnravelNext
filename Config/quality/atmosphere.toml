# Owner: S. ARCHITECTURE 2.3 (LUT sizes and quadratures), 2.4 (froxels).
[atmosphere]
transmittance_lut = [256, 64]        # Bruneton parameterisation, optical depth RGBA32F
transmittance_steps = 128            # Gauss-Legendre-4 segments per texel (convergence: Tests/AtmosphereTests)
multiscatter_lut = [32, 32]          # (sun cosine, altitude)
multiscatter_directions = 1024       # Fibonacci sphere directions per texel (sun at the horizon: planet-shadow boundary)
multiscatter_steps = 64              # quadratic-spaced exact-exponential steps per direction
# Sky view = the previous engine's far-field table at the camera altitude: 192 azimuths over [0, pi], 128 elevations
# (64 per side of the true horizon, as the previous engine's 64 per half; the first draft's 108 was coarser).
sky_view_lut = [192, 128]
sky_view_segments = 128              # quadratic segments x Gauss-Legendre 4 along each sky ray

[atmosphere.froxels]
tile_px = 24
depth_slices = 64                    # exponential in view depth between near_m and far_m (<= 64: one thread per slice)
lights_max = 32                      # per froxel list (<= 32, FROXEL_LIST_MAX); more reaching a froxel are counted
near_m = 0.5                         # slice 0 spans the camera .. near_m (far / near)^(1/64)
far_m = 65536                        # last node of the air volume (air perspective to 64 km; depths beyond clamp)
experiment_disable = 0               # cost attribution only (never in a verdict): 1 air shadows, 2 local lights, 4 air integration,
                                     # 8 sun transmittance per substep, 16 multiple scattering per substep, 32 walk stops at pages
walk_stats = 0                       # 1: count the air shadow walk (slices, mixed, block and texel loads) into the VSM
                                     # stats (RendererGate); measurement only
air_step_altitude_m = 100            # air integration substeps: at most this altitude change per step (midpoint error (dh/H_mie)^2/24)
shadow_texels_per_tile = 4           # air shadows: VSM level with texel <= tile width / 4 (boundary placement, VsmAir.hlsli)
