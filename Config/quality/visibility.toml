# Owner: V (core session). ARCHITECTURE 2.1.
[visibility]
stream_frustum_cull = true       # conservative per-view bounds rejection before triangle-stream raster work
cluster_triangles = 64            # meshlet size (max 128: vis id triangle field is 7 bits)
cluster_vertices = 64             # meshlet vertex limit (V's mesh shaders output at most 128)
# Fill of disconnected geometry (v1.36; measured fill per source cluster, 64 max: forest_thin 20.3, forest_card 13.2,
# waterside 19.7, city 41.4). Defaults keep the previous clustering until the GPU A/B (cull, raster, band counts)
# decides; the CPU fill with cluster_vertices 128, cluster_min_triangles 64, sheet_orientation_min_width 0.016 is
# forest_thin 42.2 (trees 21 -> 42, grass 6 -> 64), waterside 26.5, city 48.4.
cluster_min_triangles = 21        # a meshlet ends at a disconnected neighbour only with at least this many triangles
                                  # (meshoptimizer's default triangles / 3; 64 fills foliage clusters)
sheet_orientation_min_width = 0.0 # m: planar components at least this wide are clustered per orientation class (band A
                                  # classification of sheets); narrower ones are clustered across orientations
lod_max_relative_width_error = 0.25  # a group may simplify only with error <= this x its narrowest feature width;
                                     # thin geometry is never thinned by LOD (far thin geometry goes to band C bricks)
lod_thin_preserve_area = true     # a group of thin geometry that limit stops loses whole disconnected pieces instead (leaves,
                                  # blades, needles: every other one, evenly through the group) and the pieces that stay are
                                  # enlarged until the group has its surface area again: far thin geometry has LOD and covers
                                  # the same share of the screen. Only in builds that take the builder's own vertices
                                  # (clusterbuilder::LodVertices); false: such groups are terminal, as before
lod_error_px = 1.0                # projected LOD error threshold
occlusion_culling = true          # main view two-phase HiZ occlusion (false only for conservativeness tests)
band_a_min_width_px = 1.5         # w_px >= this: vis buffer + analytic edge coverage
band_a_hysteresis_px = 2.0        # a cluster or sheet triangle that was band B from the previous camera stays B below this
                                  # (COVERAGE_REDESIGN 14.9: 1.5 -> 2.0; sheets are classified per triangle)
band_c_max_width_px = 0.25        # w_px < this (or too many fragments): aggregate bricks
band_c_max_fragments_per_pixel = 8
coverage_hair = true              # E's strand hair segments drawn in the coverage layer (HairRaster.ms, B10) - with
                                  # coverage_layer - and shaded by M (Passes/Shading/CoverageHair.hlsl; E makes its density
                                  # volume with it). Costs nothing without hair bodies. hair_ball at 1080p, two grooms filling
                                  # the view, 3.7 M hair records [measured 2026-10-02, RTX 4080]: GPU frame 3.6 -> 21.3 ms -
                                  # the records' shading 6.6 ms, their local lights 1.5 ms, the composite over them (its
                                  # heavy pixels' sort and rounds) 7.5 ms, V's raster and S's fragment shadows 1.9 ms
coverage_subsamples = 32          # in-pixel fragment overlap ordering mask
coverage_layer = true             # main view: bands B and C drawn in the coverage layer (INTERFACES 7.1), and the translucent
                                  # layer (A6: glass) runs - with false the games' glass was white (defect queue 3: the layer
                                  # does not run) and sub-pixel geometry is lost in the vis buffer. Cost at 1440p [measured
                                  # 2026-10-01]: bath lounge +2.06 ms, bath +1.70 ms, mostly m.coverage composite at 21-24 ns
                                  # per record (design V2.5 item 7 takes it). false: the vis buffer path (A/B)
brick_resolution = 16             # band C voxel brick edge
brick_max_feature_width = 0.0     # m: meshes whose thin width (area-weighted P10 of component widths) is at most this get
                                  # band C bricks (Bricks.h); 0 = none until the bake and the march are gated
brick_bake_rays = 64              # rays per voxel cross-section and direction (13 directions) of the transmittance bake
brick_residual_max = 0.05         # largest allowed residual P99 of a mesh's voxels (|exp(-l sigma) - T_exact|), gate 1
strands_per_pixel_max = 2         # hair/grass LOD: blades or strands per pixel width before switching to bricks
# Capacities of one cull run (a view or a raster-service request). Exceeding one drops geometry and is reported in
# unx::visibility::Stats::overflow (tests and gates fail on it); they are sizes, not quality settings.
max_visible_clusters = 1048576    # visible-list entries (each draw list has the same capacity); with
                                  # visible_clusters_follow_need the floor of every run's capacity
visible_clusters_follow_need = true   # a cull run's visible-list capacity is 1.5 x the need of its latest completed frame (a
                                  # power of two from the floor up to visible_clusters_limit; shrinks below a quarter), as
                                  # S's shadow overflow list: the forest's main view needed 7.58 M entries against 1 M. The
                                  # frame whose need jumps past the capacity still drops geometry and sets the overflow
                                  # bit; the next completed frame's capacity holds it. false = the fixed capacity (as
                                  # before). Written 2026-10-03, built, not run
visible_clusters_limit = 8388608  # the most a run's capacity grows to: 2^23, the vis id's cluster field (40 B an entry:
                                  # 335 MB of transient buffers for a run at the limit)
raster_amplification = true      # tile-local raster runs (DepthRasterRequest::tileLocal): an amplification stage launches each
                                  # (cluster, tile run) pair from the visible entry's tile rectangle (no pair is stored: no pair
                                  # capacity); false = the stored pair list of capacity max_visible_clusters (A/B)
max_node_items = 4194304          # hierarchy traversal work items (instance, node) of both phases
traversal_work_queue = true       # the hierarchy traversal of a cull run (main view, every raster-service request: shadow
                                  # pages, cards) is one dispatch whose waves take node items from a work queue until it
                                  # is empty (CullNodes QUEUE=1, the reference's persistent cull) - a pass for the whole
                                  # tree where each level took a prepare pass and a node pass (10 passes a phase at depth
                                  # 5). The same nodes, groups and deferrals as the level passes. false: the level passes (A/B)
traversal_worker_groups = 64      # groups of 64 threads, each wave drains the same persistent node queue. More workers
                                  # also contend on its global claim/publish counters; this is not a node-work limit.
                                  # Bathhouse/RTX 4080: 1024 -> 64 reduced main node P1 from 0.345 to 0.037 ms.
cull_pass_merge = true            # a cull run takes fewer passes: the kernel that appends a pass's items keeps that pass's
                                  # dispatch arguments current, so the argument passes between them go (chunk items, deferred
                                  # chunks, and with traversal_work_queue the groups), and dispatches that do not read each
                                  # other's results share a pass (the reset with the chunk and instance dispatches after it;
                                  # the indirect instance dispatches; phase 2's deferred instances with its node seed, and its
                                  # two cluster dispatches; a raster request's statistics copy at the end of its raster
                                  # pass). The same kernels on the same items. With both switches a raster request is 7
                                  # passes where it was 21 (depth 5), the main view's cull 11 where it was 37.
                                  # false: one pass per dispatch and the argument passes (A/B)
fold_small_passes = true          # small passes that follow each other are timed as one scope (PassChain.h: the same passes and
                                  # barriers, one timestamp): a HiZ build's levels, a planar view's mask clear with its tiles, the
                                  # translucent layer's depth copy with its count clear, the coverage layer's single-group steps
                                  # with the passes they prepare. false: a scope each (A/B)
max_group_items = 1048576         # hierarchy leaves reached (instance, group)
max_deferred_items = 1048576      # phase-1 occluded instances / nodes / clusters retested in phase 2
coverage_table_slots = 32         # unused since INTERFACES v1.41 (tile ranges replace the chunk tables); kept so binaries
                                  # built before it still start
ocean_edges_min = 65536           # ocean edge pixel list capacity floor (v1.73, W's subsample pass); 1.5 x the need when
                                  # larger (4 B per pixel)
coverage_special_min = 262144     # special record list capacity floor (hair, stream records for their owners' shading,
                                  # v1.73); the capacity is 1.5 x the latest need when larger (8 B per entry)
coverage_pool_min_fragments_per_pixel = 1.0  # coverage record capacity floor (4K: 8.3 M records); the capacity is 1.5 x the
                                  # latest measured need when larger (37 B per record: stream 20 + ranges 16 + scratch 1)
coverage_heavy_tile_fragments = 1024  # unused since INTERFACES v1.41 (kept like coverage_table_slots)
coverage_debug_stage = 0          # measurement only: 3 = the pixel kernel returns at once, 4 = after area, depth and band A
                                  # test, 1 = after the fragment's math, 2 = after the append atomic; 0 = the layer
max_coverage_fragments = 12582912 # unused since INTERFACES v1.37 (coverage layer v2); kept so binaries built before it still
                                  # start; removed after the next integrated rebuild
coverage_band_c_visbuffer = true  # band C (under band_c_max_width_px wide) in the visibility buffer instead of the coverage layer: one
                                  # sample a pixel, averaged by the temporal upscale (the reference's way with sub-pixel geometry). The
                                  # batch of 2026-10-02: the train lounge's still view 15.0 -> 12.5 ms, the lake 23.3 -> 22.0, the
                                  # pictures the same (false: band C in the coverage layer, as before)
coverage_band_c = true            # with coverage_layer: band C clusters are drawn in the coverage layer until the band C
                                  # bricks exist; false leaves them undrawn (measurement of band B's cost only)
# The coverage raster nearer first (CoverageBuckets.hlsli; COVERAGE_REDESIGN 4.5; the reference's raster bins and depth
# buckets). Written 2026-10-03, built, not run: each switch keeps the path before it for the A/B.
coverage_depth_buckets = 4        # the band B list is sorted by its clusters' nearest distance (256 log2 bins) and drawn in
                                  # this many buckets of equal cluster counts, nearer first (2 .. 8); after each bucket its
                                  # stored opaque fragments enter a per-pixel cover (mask union, farthest depth; 8 B a
                                  # pixel) and the next buckets drop every fragment behind a full union of nearer
                                  # fragments - weight zero in the composite - and every cluster or triangle behind
                                  # tiles covered in every pixel; list entries behind band A (the final HiZ) are not drawn.
                                  # 1 = the list drawn whole in one pass, every fragment stored (as before). The stored
                                  # fragments with weight are the same; the hidden ones (waterside: 61.8 % of the stored)
                                  # are gone from the records, so coverageDepthRange's far end is the farthest stored one.
                                  # Costs 4 small passes for the bins and 2 per bucket boundary
coverage_depth_buckets_min_clusters = 64  # the buckets' passes are recorded when the latest completed frame's band B list
                                  # held at least this many clusters: a frame without thin geometry keeps the one pass
coverage_triangle_cull = true     # the coverage mesh kernel culls a triangle that can leave no fragment: outside the view,
                                  # behind band A over its rectangle (4 HiZ loads), behind the buckets' cover (its pixels
                                  # when its rectangle holds at most 8, <= 9 tile headers otherwise) - the fragment
                                  # kernel's tests, once per triangle; false = every
                                  # triangle of a drawn cluster goes to the rasteriser (as before)
coverage_drop_weightless = true   # a cluster fragment whose area rounds to step 0 of the record's 10 bits and that covers no
                                  # subsample is not stored: its composite weight is area x share = 0 and it adds no bit
                                  # to the mask union (the touching corners of the conservative raster). Readers that
                                  # take the pixel's nearest record (the local lights' coverage instance) no longer meet
                                  # such a record; false = stored (as before)
coverage_compute_raster = false   # with the buckets: a compute kernel (CoverageRasterSw.hlsl) rasterises the triangles the
                                  # near plane does not cut and whose rectangle holds at most 8 pixels - no triangle
                                  # set-up, no primitive attributes; the mesh kernel skips exactly those. Its records equal
                                  # the pixel kernel's up to the two compilations' float rounding. Off until the A/B says
                                  # what the hardware's set-up costs per small triangle (the measured 1.13 ns per triangle
                                  # is the mesh kernel and the set-up together)
coverage_statistics = false       # counts only (gate summaries): the coverage fragments by outcome - evaluated, behind band
                                  # A, behind the cover, cut by alpha, without weight - from per-wave atomics in the
                                  # fragment kernels (a pixel kernel variant: its time is not the layer's)
# The band A raster of a full view in raster bins (RasterBins.hlsl; the reference's raster bins, depth buckets and its
# software rasteriser). Written 2026-10-03, built, not run: each switch off is the raster as before.
raster_depth_sort = false         # after each cull phase the entries it added to the four band A lists (the raster
                                  # pipelines: back-face culled or not, alpha tested or not) are sorted by their
                                  # cluster's nearest distance (256 log2 bins, a counting sort) and the mesh raster draws
                                  # the sorted copy, nearer first: the depth test drops what nearer clusters of the same
                                  # draw cover before the pixel kernel (the alpha test's texture loads) and the writes.
                                  # The same depth and vis ids up to the order of equal depths. Costs 4 small passes a
                                  # phase and 4 B x 4 lists x the capacity. Off until the A/B says what the order gains
software_raster = false           # clusters without alpha test whose rectangle on screen is at most
                                  # software_raster_max_px a side (rigid or wind-deformed, a perspective view) are
                                  # rasterised by a compute kernel (VisRasterSw.hlsl) into a 64-bit depth | vis id word
                                  # per pixel by atomic max, and a pass writes those pixels into the depth buffer and the
                                  # vis id target under the depth test before the HiZ is built; the mesh raster draws the
                                  # rest. The same pixels as the hardware (1 / 256 px snap, top-left rule, pixel centres)
                                  # up to the depth's float rounding. Needs 64-bit atomics on descriptor-heap resources
                                  # (without them the mesh raster draws everything); not in debug.deterministic mode.
                                  # In a raster request with an atlas (S's shadow pages) the same split, by the
                                  # cluster's rectangle in its view (DepthRasterSw.hlsl). 8 B a pixel in the main view
software_raster_max_px = 32       # the largest cluster rectangle the software rasteriser takes (1 .. 64: its integer
                                  # edge functions hold 64 px). The reference decides per cluster by its triangles' size;
                                  # here the cluster's rectangle bounds every triangle's loop
software_raster_pages = 256       # a raster request's software pages (one per set tile of its views, 4 B a texel: 64 KB
                                  # for a 128 px shadow page): the floor of the capacity, which is 1.5 x the set tiles
                                  # of the request's latest completed frame, a power of two up to
                                  # software_raster_pages_limit and the atlas's slots. A tile past the capacity loses
                                  # nothing: the clusters over it stay with the mesh raster
software_raster_pages_limit = 4096  # the most (<= 16384; 4096 pages of 128 px: 268 MB of transient memory for a request
                                  # that draws them all)
# Compressed cluster vertices (Tools/ClusterBuilder ClusterStream.h; the reference's cluster encoding). A cook setting:
# it changes what the builder returns, not the cached hierarchies. Written 2026-10-03, built, not run.
cluster_compression = false       # clusters of rigid meshes (no skin, blend shapes or vertex animation) carry their own
                                  # vertices as a bit stream - positions on the mesh's grid less the cluster's smallest,
                                  # in the bits its extent needs; octahedral normal; tangent as an angle around it; uv
                                  # in the cluster's range. The cook puts those meshes' positions on a power-of-two grid
                                  # first (clusterbuilder::snapPositions: at most half a millimetre), so the stream's
                                  # positions are the vertex pool's floats. Its readers (about 10 B a vertex instead of
                                  # an index and 32 B): the vis buffer and depth rasters, the material resolve, the
                                  # motion vectors, the history reprojections. The 32 B vertex pool stays whole - the
                                  # rays' hit attributes, the coverage raster and shading, the composites, skinned
                                  # instances - so the scene's memory grows by the stream (the cook's log gives the
                                  # sizes); the stream is what a streamed cluster page holds (cluster_streaming)
cluster_position_step = 0.0009765625  # m (1 / 1024): the position grid of a mesh is the largest power of two at most
                                  # this and a 4096th of the mesh's half diagonal (raised when the mesh is too large
                                  # for 2^23 steps from its origin or a cluster for 21 bits an axis)
cluster_normal_bits = 10          # per octahedral axis (4 .. 12)
cluster_tangent_bits = 8          # the tangent's angle around the normal (4 .. 11), and one bit for the bitangent sign
cluster_uv_bits = 12              # per axis over the cluster's uv range (4 .. 15)
# Cluster streaming (Visibility.h ClusterPageSource, unx/visibility/ClusterPages.h; the reference's streaming pages).
# Written 2026-10-03, built, not run. With cluster_compression: the cook setting decides what the build returns, the
# others what the renderer does with it.
cluster_streaming = false         # the compressed vertex bits of every group that a coarser one can stand in for go
                                  # into 64 KB pages (whole groups) in a page file instead of the scene's buffer; each
                                  # mesh's coarsest groups stay resident. The cull kernels stamp the pages their cuts
                                  # want; the renderer requests those and what they depend on, a DirectStorage streamer
                                  # brings them into a VRAM pool, and each frame has a page table: a group whose page
                                  # is not resident is not drawn and the clusters simplified from it are drawn in its
                                  # place (a page is requested in the frame after the cut wanted it and is drawn two or
                                  # more frames later). What is streamed is the stream the vis buffer and depth rasters
                                  # read; the 32 B vertex pool, which the material resolve and the rays read, stays
                                  # resident whole - so this adds the pool of pages and saves no memory until those
                                  # readers take the stream too
cluster_streaming_keep_frames = 30  # a page stays requested this many frames after a cut last wanted it; then it is the
                                  # streamer's to evict, least recently requested first
cluster_streaming_pool_mb = 256   # the pages' VRAM pool (64 MB heaps; 0: a quarter of the device's free budget)
cluster_streaming_upload_mb = 16  # page bytes uploaded per frame at most
