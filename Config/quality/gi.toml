# Owner: R. ARCHITECTURE 2.5.
[gi]
rays_per_frame = 500000
cache_entries = 200000
cache_octahedral_texels = 8        # 8 x 8 per entry
screen_probe_spacing_px = 8
near_occlusion_radius_m = 0.5
near_occlusion_taps = 16
screen_occlusion_history_frames = 16  # the probes' near occlusion integrated over time (GiProbeGather: the 16 points turn every
                                   # frame, the probe's surface point found in last frame's probes by its exact motion; a
                                   # running mean over at most this many frames, clamped to 3 sigma of the frame's own
                                   # estimate). 1 = each frame's 16 points alone: 1/16 steps per probe, an 8 x 8 px pattern
                                   # where anything occludes. Geometry only, so no lighting lag.
screen_filter_cells = 0.75         # r.gi.screen.filter: edge-preserving spatial filter of M's per-pixel cache irradiance over
                                   # this share of the pixel's cache cell edge (plane, normal^32 and data weights, 12 taps);
                                   # it averages the cells' independent errors (blotches of the cell's size). 0 = no spatial
                                   # filter (the pass still multiplies the probes' near occlusion in: M reads E x occlusion).
screen_update_frames = 1          # r.gi.screen's frame split (user decision 2026-09-28, GiScreenIrradiance SPLIT=1): the main
                                   # view's 8 x 8 tiles look the cache up in turn, one frame of N; the other pixels take their
                                   # own surface point's value of the previous frame when 4 neighbours hold the same surface.
                                   # 1 = off (the default since 368e103: 0.89 -> 0.98 ms at internal 1440p [measured] - the
                                   # neighbours' normal test uses the normal-mapped G-buffer normal, so textured surfaces fail
                                   # it, and the lookup depends on that exact normal: no exact reuse there).
relight_frames_max = 8             # frames to reconverge after a light change (quality definition, section 3)
cache_cell_angle_deg = 0.5         # cache cell edge ~ distance * tan(angle): ~16 px at 4K 60 deg (level = ceil(log2(edge / min)))
cache_cell_min_m = 0.0625          # finest cell edge (level 0)
cache_levels_max = 24
cache_max_age_frames = 240         # LRU eviction of entries not used (by probes or ray hits) for this many frames
jacobi_updates = 8                 # after a reset (new entry, lighting epoch change): updates without averaging (multi-bounce
                                   # converges geometrically: rho^8 < 0.4 % at albedo 0.5)
history_updates_max = 32           # then the running mean over at most this many updates (static scenes converge; slow
                                   # changes such as a moving sun are followed with this window)
split_bounce_history = false       # experimental: separate non-bounce long mean from cache-bounce short mean;
                                   # enable only after bath 1080p / 3000-frame luminance and motion validation
bounce_history_updates = 4         # short window after the Jacobi phase (the long component uses the existing window)
bounce_split = false               # V2.2 11.2 (P1'-b): the map, SH and texels as the long mean M of the samples plus the
                                   # correction B - Bm (the rays' cache-fed part, current and long mean, as L1 radiance SH,
                                   # 48 B per entry): weights by update count only, no Jacobi phase; the bounce part follows
                                   # its neighbours' current values (the running mean converged as n^-(1 - rho))
bounce_split_updates = 1           # the current bounce part's window (1 = replacement: contraction rho per update)
anchor_resample = false            # V2.2 P1'-b: each update moves the entry's anchor to a random point among the surface
                                   # points that looked it up since its last update (the value = the mean over where the cell is
                                   # read, not the irradiance at its creator's point: the level depended on the history)
history_updates_max_static = 256   # the running mean's window while the entry's light is steady: a fast mean (1/16) of its
                                   # anchor irradiance within 4 sigma (the update's own ray spread) of the history; a change
                                   # beyond that cuts the window to history_updates_max at once (moving sun, lights: any speed).
                                   # 32 left the bathhouse's indirect light -11 % and its cell blotches at 19 % per-update noise
                                   # x 0.18 [measured, 2026-09-27]; 256 converges it (stores round stochastically: unbiased)
# Redesign V2 P1 (RENDERER_REDESIGN_V2 1.1; the previous rules stay behind these switches for A/B):
update_tiers = false               # off by default (measured, P1): with parent_prior it slowed the reflection furnace's hit
                                   # cells (3 of 3 runs fail, each alone passes), and neither changed the cut recovery in the
                                   # bath or train (tile P95 within 1-2 points of off at frames 1-256). 1.1a: requested entries with fewer than 4 measured updates since their creation or
                                   # restart first (T0, at most young_update_share of each request tier's updates), then
                                   # 4..15 (T1), then the stalest (the previous rule); false = age order alone
young_update_share = 0.6           # the most of a tier's updates T0 takes (the rest keeps the converged cells rotating)
parent_prior = false               # 1.1b: a first update starts from the converged parent (level + 1, else + 2) worth
                                   # kappa = (update spread / parent_delta)^2 in [2, 64] updates, Jacobi skipped; the
                                   # parent is kept alive and requested (created) while the entry is young
parent_delta_initial = 0.05        # the parent-child relative difference assumed until GiIntegrate has measured it
relight_restart = false            # an entry whose update lies 5 sigma + 5 % from its history restarts (weight 1/2, T0).
                                   # Off: one update is not a robust change test - the bath's local-light samples are
                                   # heavy-tailed, the test fired on single bright updates and pulled cells toward them
                                   # (65 % of the read entries stayed "young" in a still 600-frame run, P1 first run)
hit_light_footprint_scale = 1.0    # diagnostics: the footprint's side over the texel cone's. Energy audit (32768, 600 frames,
                                   # clearcoat stripped, 1080p [measured]): footprint / point energy over the same hits 0.946 /
                                   # 0.968 / 0.986 (bath) and 0.914 / 0.962 / 0.985 (train) at 1 / 0.5 / 0.25, the same
                                   # without visibility: the footprint reaches past the real surface (lamp fixtures, corners)
light_invalidation = true          # P1: a light whose record changed (GpuScene::setLights: switched, dimmed, moved) restarts
                                   # the entries whose texel rays see its range (GiInvalidate), instead of keeping its old
                                   # bounce light for the steady window
hit_light_footprint = false        # P1 experiment: a point or spot light's diffuse term at a GI ray hit as its exact mean over
                                   # the texel ray's footprint on the hit plane (GiTrace giPointFootprintScale), not its value
                                   # at one point (a lamp's 1 / d^2 hotspot gives rare huge samples: bathhouse, 44 % of the GI
                                   # energy from hits over 1000 nit). It removes the cells' bright spots but darkens the bath
                                   # by a further 2-4 % against the path tracer (-17.6 % vs -13.9 % at 2000 frames, 1080p
                                   # [measured, P1]): off until the footprint model keeps the energy
ray_length_m = 10000
hit_update_share = 0.25            # share of the hemisphere updates guaranteed to entries that GI rays hit (bounce cells)
hit_cell_footprint_scale = 2.0     # bounce cells (2nd+ bounce irradiance at ray hits) = this x the ray footprint (~0.36 t);
                                   # 4 made a few room-sized cells carry a bright room's multi-bounce light: their noise moved
                                   # the whole bathhouse by 7-11 % between runs, 2: 1.7 % (cache 74 k -> 94 k entries, GI +0.01 ms
                                   # at 1440p) [measured, 2026-09-27];
                                   # direct sun at hits is an exact shadow ray
deterministic = false              # same inputs -> bit-identical GI: update selection by key priority (radix select),
                                   # ray seeds by key (user decision: a mode switch until the budget shows the margin)
anchor_visibility = false          # true: lookups skip a cell entry whose anchor's rays stop before the point (the entry's
                                   # texel toward it: mean hit distance x 1.5 + a quarter cell; > 45 deg behind its surface),
                                   # for the ~3 % sunlight leak through walls sharing a coarse cell. Off: skipping corners
                                   # next to real occluders (a tub's base, walls) moves the level's weight onto the rest cell
                                   # by cell, and those decisions draw cell-shaped bright patches on floors and dots in
                                   # reflections that main does not have (bathhouse 1080p, 20379fb / 1db06e4 [measured])
experiment_disable = 0             # cost attribution only (recorded in the quality hash): 8 = hit materials without
                                   # textures, 16 = no sun at GI hits, 32 = GI rays that leave the scene below the
                                   # horizon get 0 (not the sky LUT's lit planet ground), 64 = independent ray jitter per
                                   # update (not the R2 sequence over the entry's updates), 128 = no local lights at GI hits, 256 = no emissive-triangle
                                   # samples (the texel rays alone see emissive meshes), 512 = GI hits without the cache's
                                   # bounce (one bounce: unx_reference --surface-order 1:2), 1024 = Lambert GI hits (GiAnalytic's
                                   # closed forms), 4096 = local lights at GI hits: every light of the cell with
                                   # its shadow ray instead of one sample (diagnostic), 32768 = energy audit (point term against
                                   # footprint mean over the same hits, printed by renderergate --out). Never nonzero outside
                                   # measurements and those tests.
