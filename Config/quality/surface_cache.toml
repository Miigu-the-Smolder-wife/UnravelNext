# Owner: S2 (reflection session). The surface cache: lighting of the surfaces around the camera kept in world space
# (Native/Render/Passes/SurfaceCache/SurfaceCache.hlsli), the part Lumen's surface cache plays for ray hits. Rules and
# defaults follow ue6-main's card surface cache (LumenSceneRendering.cpp, LumenSceneLighting.cpp,
# LumenSceneDirectLighting.cpp, LumenRadiosity.cpp); the texels are cells of a hashed world grid.
[surface_cache]
enabled = true
entries_log2 = 22                     # cell slots (2^22; 52 B each, with the probes 255 MB). The reference's atlas: 4096^2 = 2^24
                                      # texels. The lobby lit 1.9 M cells of 2^21 (table 91 % full: marks failed) [measured]
max_unused_frames = 255               # a cell is kept this long past its last mark (reference: unused pages 256 frames)
capture_factor = 64                   # cells marked per frame by the capture rays = slots / this (reference: texels / 64)
capture_bounces = 3                   # a capture path's bounces after its first hit
direct_update_factor = 32             # cells relit per frame = slots / this (reference: texels / 32)
radiosity_update_factor = 64          # probes updated per frame = slots / this / 16 (reference: texels / 64, a probe per 4 x 4)
radiosity_max_ray_intensity = 40.0    # QUALITY TRADE (user decision): a radiosity ray's exposed radiance is capped here; 0 = no cap
radiosity_max_frames_accumulated = 4.0
radiosity_avoid_self_intersections = true  # (mesh cards) a radiosity ray whose first hit is a near back face is shot once
                                      # more past it (reference: r.Lumen.HardwareRayTracing.AvoidSelfIntersections, the
                                      # retrace mode): the ray geometry is not the captured surface texel for texel, and a
                                      # ray that starts under it would bring the surface's own inside. false: the first
                                      # hit stands
radiosity_skip_back_face_m = 0.05     # ... the back of a one-sided surface nearer than this: again from this distance
                                      # (reference: SkipBackFaceHitDistance 5 cm)
radiosity_skip_two_sided_m = 0.01     # ... a two-sided surface nearer than this: again from just past the hit (reference:
                                      # SkipTwoSidedHitDistance 1 cm)
radiosity_min_trace_distance_m = 0.10 # (mesh cards) a radiosity ray's hit nearer than this blocks the ray and reads no
                                      # light: a card texel would light itself (reference:
                                      # MinTraceDistanceToSampleSurfaceCache 10 cm). 0: every hit reads the cache
direct_lighting = true
radiosity = true
remainder_light = false               # QUALITY TRADE (user decision) when false, as the reference: a cell's direct light is its 8
                                      # strongest lights and the rest are dropped; true = one more light drawn from the rest
direct_stochastic = false             # the reference's stochastic direct lighting (off by default there): one light sample per
                                      # cell per update from all its lights (A's MegaLightsWorld.hlsli), a running mean
direct_stochastic_max_frames = 12.0   # (reference: Stochastic.Temporal.MaxFramesAccumulated 12)
direct_stochastic_min_sample_weight = 0.001
lighting_feedback = true              # cells a reflection or GI hit read since the last frame are relit ahead of the others
                                      # (reference: r.LumenScene.Lighting.Feedback 1); half of the budget left after new cells.
                                      # Mesh cards: a card page a reader of the high levels (a reflection, the radiosity)
                                      # read within the last two updates is relit at 4 x the speed
direct_analytic = true                # each of the cell's 8 lights: its unshadowed irradiance by the light's integral, one shadow
                                      # ray to the light's centre (the reference's default path: a cell's value is the same at
                                      # every update; area lights cast hard shadows in the cache). false: one random point on
                                      # each light per update (soft shadows over updates, cells differ from update to update)
bilinear_read = true                  # a hit's value is the bilinear blend of the four cells around it in its face's plane, cells
                                      # that are not there left out (reference: a card's four texels with depth weights). false:
                                      # the hit's own cell - cells show as squares
debug_skip = 0                        # diagnostics (which part of the cell lighting a fault is in), a sum of: 1 no local lights,
                                      # 2 no sun, 4 the lights are chosen but not evaluated, 8 evaluated without shadow rays,
                                      # 16 the lights' shadow rays under the GI mask
shadow_rays_opaque = false            # QUALITY TRADE (user decision; the reference's default is on: no alpha masking in Lumen's
                                      # hardware rays): true = the cells' shadow rays (lights, sun) take alpha-tested casters as
                                      # solid - no any-hit work per ray. Off here: it changes the cached shadows and did not
                                      # cure the lounge hang it was tried for (2026-10-02)
direct_pairs = true                   # (A, 2026-10-02) the cells direct light as (cell, light) pairs in three passes: select
                                      # (compute, no ray: the 8 strongest lights, their integrals, the sun), trace (one shadow
                                      # ray per pair record, dispatches of at most 262,144), store. The same lighting as
                                      # direct_analytic. Passes/SurfaceCache/SurfaceCacheLightPairs.hlsli.
                                      # false: r.sc.cells lights the cell inside one ray generation thread (up to 18 TraceRay
                                      # calls in loops) - THAT PATH STOPS THE DEVICE IN THE BATH LOUNGE (device hung,
                                      # 2026-10-02); it also holds the modes the pairs do not: direct_stochastic,
                                      # remainder_light, direct_analytic = false.
direct_pairs_inline = false           # (with direct_pairs) the pair rays as inline queries in a compute kernel (no ray pipeline);
                                      # false: a ray generation shader with rtVisible, as MegaLights traces - the variant that ran
                                      # in the bath lounge. The inline variant ran in the lobby only (trace 0.05 ms against 0.10).
direct_shadow_inline = false          # (with direct_analytic) the cell's lights are evaluated first and their shadow rays follow
                                      # as inline ray queries in a loop of a fixed count - no trace suspends the shader, and a
                                      # ray tests at most 64 alpha-tested candidates. Written for the lounge hang (the shadow
                                      # rays toward the light centres); NOT run yet
debug_count = 0                       # diagnostics (1; 2 = of the empty reads only the back faces; 3 = sums instead: view g =
                                      # the lit hits' sun irradiance, lux / 16 / 65536 summed, r = their local-light + indirect
                                      # irradiance over that): counts this frame's radiosity rays that met geometry and those that read no
                                      # light there (no lit cell, a back face); shown by reflection.lumen_surface_cache_view with
                                      # lumen_surface_cache_view_component = 7 (r = the share, g = rays / 65536). NOT run yet
base_cells = true                     # a mark also keeps the cell 3 levels coarser (8 x the size) at the point, and a read that
                                      # finds no lit cell at the point's level takes that base cell (reference: every mesh in
                                      # range keeps its lowest-resolution cards). false: such a read gets nothing
mesh_cards = true                     # the cache as lighting on mesh cards (the reference's shipping structure:
                                      # unx/refl/SurfaceCacheCards.h) in place of the hashed cells: every rigid instance in
                                      # range keeps cards captured into atlases whatever the view sees; update selection by
                                      # page priority, direct light per card tile (8 lights + the sun), radiosity per card
                                      # probe, the final lighting atlas; hits read the cards of their instance
mesh_cards_fold_passes = true         # the page selection's three steps (priority, bucket, list) are one pass (PassChain.h:
                                      # the same dispatches in order, a barrier between them). false: a pass each (A/B)
mesh_cards_capture_clusters = false   # the card captures are drawn from the cluster hierarchy's cut at the page's texel
                                      # size through V's raster service (the reference captures its cards through Nanite):
                                      # a dense mesh costs by the page's texels, not by its source triangles. A page is a
                                      # view of a service request (at most 255 a request, two runs of the service each:
                                      # the nearest surface, then its material). The texel's normal is then the drawn
                                      # triangle's (the service gives a pixel no vertex normal: a smooth-shaded
                                      # low-polygon mesh shows its facets in the card). false: the mesh's source
                                      # triangles in a mesh shader of the cache's own. NOT run yet: off
mesh_cards_atlas_size = 4096          # card atlas side, texels (reference: r.LumenScene.SurfaceCache.AtlasSize 4096)
mesh_cards_captures_per_frame = 300   # card pages captured a frame at most (reference: CardCapturesPerFrame 300); with
                                      # capture_factor: texels captured a frame = atlas texels / capture_factor
mesh_cards_texel_density_scale = 100.0  # a card's texels along its longer side = this x half size / distance (reference:
                                      # CardTexelDensityScale 100)
mesh_cards_max_texels_per_m = 20.0    # ... at most this many per metre of half size (reference: CardMaxTexelDensity 0.2 / cm)
mesh_cards_max_resolution = 512       # ... and at most this many (reference: CardMaxResolution 512)
mesh_cards_min_resolution = 4         # a card under this many texels is not kept (reference: CardMinResolution 4)
feedback = true                       # (mesh cards) pages above a card's resident level where the screen reads the card
                                      # closer than that level holds (reference: r.LumenScene.SurfaceCache.Feedback 1):
                                      # the hits of the reflections and of the radiosity report the page and the level
                                      # their footprint wants, the CPU reads the reports a frame later, maps and captures
                                      # those pages, and lets the ones no hit asks for any more leave, the one used
                                      # longest ago first. false: every card has its distance's level only
feedback_tile_size = 16               # one hit in a tile of this many pixels (trace texels) a side reports a frame, from a
                                      # place that moves every frame (reference: Feedback.TileSize 16; a power of two)
feedback_res_level_bias = -0.5        # added to the level a hit asks for, log2(the card's half size / the ray cone's
                                      # radius at the hit) (reference: Feedback.ResLevelBias -0.5); +1 = twice the texels
feedback_min_page_hits = 16           # a page asked for by no more hits than this in a frame is not mapped (reference:
                                      # Feedback.MinPageHits 16)
feedback_keep_unused_frames = 256     # a feedback page no hit asked for this many frames leaves the atlas (reference:
                                      # NumFramesToKeepUnusedPages 256)
feedback_gather = false               # the screen probes' hits read the high levels and report too. false, as the
                                      # reference: its gather reads the resident level and reports nothing (its cones are
                                      # wide: a probe ray's footprint is seldom finer than the resident level)
mesh_cards_max_distance_m = 300.0     # cards exist for instances within this of the camera (reference: the ray tracing
                                      # culling radius, 30000 cm)
mesh_cards_min_size_m = 0.1           # meshes and cards smaller than this have no cards (reference: MeshCardsMinSize 10 cm)
mesh_cards_refresh_fraction = 0.125   # share of a frame's captures spent on drawing resident pages again, so materials that
                                      # change reach the cache (reference: CardCaptureRefreshFraction 0.125)
mesh_cards_load_rounds = 8            # NOT in the reference: while a level loads (a new scene, a restore) the cache runs this
                                      # many updates a frame instead of one, so its cards are captured and lit within a few
                                      # frames of the load instead of about a hundred. 1 = the reference's pace
mesh_cards_load_lighting_rounds = 96  # ... and this many more updates after the load's last card was captured (every
                                      # page's direct light, then the radiosity's bounces), before the pace returns to 1
mesh_cards_cache_dir = ""             # where generated mesh cards are kept: "" = %LOCALAPPDATA%/UnravelNext/MeshCards,
                                      # "none" = no disk cache (every load generates)
mesh_cards_update_distance_m = 25     # the distance at which a card page's update speed halves (reference: the first clipmap's extent)
mesh_cards_frustum_margin_m = 5       # pages within this of the view frustum update twice as fast
mesh_cards_depth_bias_m = 0.10        # a hit reads a card texel whose depth is within this of the hit (reference: 10 cm)
